<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carter Budget</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root {
    --bg:#F4F3F0; --surface:#FFFFFF; --surface-2:#FAF9F7; --border:#E4E1DB;
    --text:#23262A; --muted:#767B82; --faint:#9BA0A6;
    --accent:#45688E; --accent-bg:#ECF1F6;
    --good:#5D9078; --good-bg:#EDF3F0; --warn:#C79553;
    --over:#B8676C; --over-bg:#F7EDED; --r:12px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; -webkit-font-smoothing:antialiased; }
  #app { max-width:500px; margin:0 auto; min-height:100vh; padding-bottom:76px; }

  header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 18px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; }
  header .sub { font-size:13.5px; color:var(--muted); font-weight:500; }
  .sync-btn { border:1px solid var(--border); background:var(--surface-2); color:var(--accent);
    font-size:13px; font-weight:500; padding:7px 12px; border-radius:8px; cursor:pointer; font-family:inherit; }
  .sync-btn:active { background:var(--accent-bg); }
  .sync-btn[disabled] { color:var(--faint); }

  .view { display:none; padding:12px 14px 4px; }
  .view.active { display:block; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px; margin-bottom:10px; }
  .card.tight { padding:10px 14px; }
  .section-label { font-size:12.5px; color:var(--muted); margin:14px 2px 7px; font-weight:500;
    display:flex; justify-content:space-between; align-items:center; }
  .section-label a { color:var(--accent); cursor:pointer; font-weight:500; }

  /* month picker */
  .months { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; }
  .months::-webkit-scrollbar { display:none; }
  .mpill { flex:none; font-size:12.5px; padding:6px 12px; border-radius:8px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface); color:var(--muted); white-space:nowrap; }
  .mpill.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500; }

  /* categorize */
  .txn-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .txn-payee { font-size:15px; font-weight:550; letter-spacing:-.005em; }
  .txn-meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .txn-amt { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .txn-amt.in { color:var(--good); }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:11px; }
  .chip { font-size:12.5px; padding:5px 10px; border-radius:7px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text); }
  .chip.excl { color:var(--muted); font-style:italic; }
  .chip.save { background:var(--good-bg); border-color:#D3E2DA; color:#3F6B57; }
  .chip:active,.chip.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.sug { border-color:var(--accent); border-style:dashed; color:var(--accent); background:var(--accent-bg); }
  .chip-save { font-size:12.5px; font-weight:600; padding:5px 14px; border-radius:7px; cursor:pointer;
    border:1px solid var(--accent); background:var(--accent); color:#fff; margin-left:2px;
    font-family:inherit; line-height:1.45; }
  .chip-save:active { background:#3A587A; }
  .chip-div { flex-basis:100%; font-size:11px; color:var(--faint); margin:6px 0 1px; }

  /* rows */
  .brow { padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .brow:last-child { border-bottom:none; }
  .brow-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:8px; }
  .brow-cat { font-size:14px; font-weight:500; }
  .brow-num { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .brow-num b { color:var(--text); font-weight:600; }
  .track { height:5px; background:#EDEBE7; border-radius:3px; overflow:hidden; }
  .fill { height:100%; border-radius:3px; background:var(--good); transition:width .3s ease; }
  .fill.warn { background:var(--warn); }
  .fill.over { background:var(--over); }

  .mrow { display:flex; align-items:center; gap:6px; padding:7px 0; border-bottom:1px solid var(--border); }
  .mrow:last-child { border-bottom:none; }
  .grip { color:var(--faint); cursor:grab; font-size:15px; padding:2px 6px 2px 0; flex:none;
    user-select:none; touch-action:none; letter-spacing:-1px; }
  .grip:active { cursor:grabbing; }
  .mrow { background:var(--surface); transition:background .2s; }
  .mrow.dragging { position:relative; z-index:5; background:var(--accent-bg);
    box-shadow:0 3px 12px rgba(0,0,0,.12); border-radius:8px; }
  .mrow.dragging .grip { color:var(--accent); }
  .mrow.just-moved { background:var(--good-bg); }
  .mname { flex:1; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mtype { width:92px; margin:0; padding:6px 6px; font-size:12px; flex:none; }
  .mamt { width:76px; margin:0; padding:6px 8px; font-size:13px; text-align:right; flex:none; }
  .mdel { color:var(--faint); cursor:pointer; font-size:17px; padding:0 3px; flex:none; }

  .flow { display:flex; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--border); }
  .flow:last-child { border-bottom:none; }
  .flow .fl { flex:1; font-size:14px; }
  .flow .fv { width:96px; text-align:right; font-size:14px; font-variant-numeric:tabular-nums; }
  .flow-head { border-bottom:1px solid var(--border); padding-bottom:5px; }
  .flow-head .fv { font-size:11.5px; color:var(--muted); }
  .flow-total { border-top:1.5px solid var(--text); border-bottom:none; margin-top:3px; padding-top:9px; }
  .flow-total .fl, .flow-total .fv { font-weight:640; font-size:15px; }

  .totals { display:flex; gap:10px; }
  .totals > div { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px 13px; }
  .totals .lbl { font-size:11.5px; color:var(--muted); }
  .totals .val { font-size:20px; font-weight:620; font-variant-numeric:tabular-nums; margin-top:2px; letter-spacing:-.02em; }

  .lrow { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); }
  .lrow:last-child { border-bottom:none; }
  .acct-row { cursor:pointer; margin:0 -14px; padding-left:14px; padding-right:14px; position:relative; }
  .acct-row .vl { padding-right:0; }

  .acct-row:hover { background:var(--surface-2); }
  .acct-row:active { background:var(--accent-bg); }
  .brow, .spark-row { cursor:pointer; margin:0 -14px; padding-left:14px; padding-right:26px; position:relative; }
  .brow:after, .spark-row:after { content:'›'; position:absolute; right:8px; top:50%;
    transform:translateY(-52%); color:var(--faint); font-size:16px; line-height:1; }
  .brow:hover, .spark-row:hover { background:var(--surface-2); }
  .lrow .nm { font-size:14px; font-weight:500; }
  .lrow .sb { font-size:11.5px; color:var(--faint); }
  .lrow .vl { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }

  .note { font-size:12.5px; line-height:1.5; color:var(--muted); background:var(--accent-bg);
    border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .note.flag { background:var(--over-bg); color:#8C4A4E; }
  .empty { text-align:center; padding:48px 20px; color:var(--muted); font-size:13.5px; }
  .empty b { display:block; color:var(--text); font-size:15px; margin-bottom:3px; font-weight:550; }

  .btn { display:block; width:100%; padding:12px; border-radius:9px; border:none; background:var(--accent);
    color:#fff; font-size:14.5px; font-weight:500; cursor:pointer; font-family:inherit; }
  .btn:active { background:#3A587A; }
  .btn.ghost { background:var(--surface-2); color:var(--accent); border:1px solid var(--border); }
  input,select { width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:8px;
    font-size:14.5px; margin-bottom:8px; font-family:inherit; background:var(--surface-2); color:var(--text); }
  label { font-size:12.5px; color:var(--muted); display:block; margin-bottom:3px; }

  nav { position:fixed; bottom:0; left:0; right:0; max-width:500px; margin:0 auto;
    background:rgba(255,255,255,.94); backdrop-filter:blur(12px); border-top:1px solid var(--border);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20; }
  nav button { flex:1; padding:11px 0 10px; background:none; border:none; font-size:10.5px;
    color:var(--muted); cursor:pointer; font-family:inherit; }
  nav button.active { color:var(--accent); font-weight:600; }
  nav .dot { display:block; font-size:16px; line-height:1.1; margin-bottom:1px; }
  .back { font-size:13px; color:var(--accent); cursor:pointer; margin-bottom:10px; display:inline-block; }

  /* split panel */
  .split-link { font-size:12px; color:var(--accent); cursor:pointer; margin-top:9px; display:inline-block; }
  .split-box { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
  .split-line { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .split-line select { flex:1; margin:0; font-size:13px; padding:8px 9px; }
  .split-line input { width:88px; margin:0; font-size:13px; padding:8px 9px; text-align:right; }
  .split-line .rm { color:var(--faint); cursor:pointer; font-size:17px; padding:0 3px; flex:none; }
  .split-foot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; }
  .split-tally { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .split-tally.bad { color:var(--over); }
  .split-foot button { font-size:12.5px; padding:7px 12px; border-radius:7px; cursor:pointer; font-family:inherit; border:1px solid var(--border); }
  .split-foot .add { background:var(--surface-2); color:var(--accent); }
  .split-foot .go { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tgl-gap { flex:none; width:40px; }
  .vault-hint { font-size:11px; color:var(--faint); font-weight:400; }
  .tgl { flex:none; width:40px; height:23px; margin-left:10px; border-radius:999px; background:#DDD9D2;
    position:relative; cursor:pointer; transition:background .15s; }
  .tgl.on { background:var(--good); }
  .tgl .knob { position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:left .15s; }
  .tgl.on .knob { left:19.5px; }
  .section-label span { cursor:pointer; }

  .rule-cat { font-size:12.5px; color:var(--accent); background:var(--accent-bg); padding:3px 8px; border-radius:6px; }

  /* filter bar */
  .filters { background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    padding:10px; margin-bottom:10px; }
  .seg { display:flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .seg button { flex:1; padding:7px 2px; background:var(--surface-2); border:none; font-size:11.5px;
    color:var(--muted); cursor:pointer; font-family:inherit; border-right:1px solid var(--border); }
  .seg button:last-child { border-right:none; }
  .seg button.on { background:var(--accent); color:#fff; font-weight:500; }
  .frow { display:flex; gap:6px; }
  .frow select, .frow input { margin:0; font-size:12.5px; padding:7px 8px; }
  .fcount { font-size:11.5px; color:var(--faint); margin-top:7px; }

  .cat-badge { font-size:12px; color:var(--accent); background:var(--accent-bg);
    padding:3px 9px; border-radius:6px; cursor:pointer; display:inline-block; margin-top:9px; }
  .cat-badge.excl { color:var(--muted); background:#F0EFEC; font-style:italic; }
  .prj-row { display:flex; align-items:center; gap:8px; margin-top:9px; }
  .prj-label { font-size:12px; color:var(--muted); flex:none; }
  .prj-pick { margin:0; font-size:12.5px; padding:6px 8px; flex:1; }
  .prj-tag { font-size:10.5px; color:#5B6CB8; border:1px solid #D9DDF2; background:#F0F2FB;
    padding:2px 7px; border-radius:5px; margin-left:5px; vertical-align:1px; }
  .auto-tag { font-size:10.5px; color:var(--warn); border:1px solid #E8DCC4; background:#FBF6EC;
    padding:2px 6px; border-radius:5px; margin-left:5px; vertical-align:1px; }
  .clear-cat { font-size:12px; color:var(--faint); cursor:pointer; margin-left:8px; }

  /* bulk select */
  .card.pick-mode { cursor:pointer; }
  .card.picked { border-color:var(--accent); background:var(--accent-bg); }
  .pick-dot { width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border);
    background:#fff; flex:none; margin-right:10px; position:relative; }
  .card.picked .pick-dot { background:var(--accent); border-color:var(--accent); }
  .card.picked .pick-dot:after { content:'✓'; color:#fff; font-size:12px; position:absolute;
    left:3px; top:-1px; }
  .bulk-bar { position:fixed; bottom:56px; left:0; right:0; max-width:500px; margin:0 auto;
    background:var(--surface); border-top:1px solid var(--border); padding:10px 14px; z-index:25;
    box-shadow:0 -2px 12px rgba(0,0,0,.06); }
  .bulk-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .bulk-head span { font-size:13px; font-weight:500; }
  .bulk-head a { font-size:12.5px; color:var(--accent); cursor:pointer; }
  .bulk-row { display:flex; gap:6px; }
  .bulk-row select { flex:1; margin:0; font-size:13px; padding:9px; }
  .bulk-row button { flex:none; font-size:13px; padding:9px 14px; border-radius:8px; cursor:pointer;
    font-family:inherit; border:1px solid var(--border); background:var(--surface-2); color:var(--accent); }
  .bulk-row button.go { background:var(--accent); color:#fff; border-color:var(--accent); }

  .save-row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; }
  .save-pick { font-size:12.5px; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .save-pick b { color:var(--text); font-weight:600; }

  /* sparkline grid */
  .spark-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .spark-row:last-child { border-bottom:none; }
  .spark-name { flex:1; min-width:0; }
  .spark-name .n { font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spark-name .d { font-size:11px; color:var(--faint); }
  .spark-name .d.bad { color:var(--over); }
  svg text { font-family:inherit; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="sub" id="subtitle">Loading</div>
    <button class="sync-btn" id="sync-btn">Sync</button>
  </header>
  <section class="view active" id="view-categorize">
    <div class="filters">
      <div class="seg" id="seg-status">
        <button class="on" data-s="todo">To do</button>
        <button data-s="done">Categorized</button>
        <button data-s="pending">Pending</button>
        <button data-s="all">All</button>
      </div>
      <div class="frow">
        <select id="f-account"><option value="all">All accounts</option></select>
        <select id="f-sort">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="largest">Largest</option>
          <option value="smallest">Smallest</option>
        </select>
      </div>
      <div class="frow" style="margin-top:6px">
        <select id="f-month"><option value="all">All months</option></select>
        <select id="f-category"><option value="all">All categories</option></select>
      </div>
      <div class="frow" style="margin-top:6px">
        <input type="text" id="f-search" placeholder="Search payee">
      </div>
      <div class="fcount" id="f-count"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <span id="select-toggle" style="font-size:12.5px;color:var(--accent);cursor:pointer">Select multiple</span>
        <span id="select-all" style="font-size:12.5px;color:var(--accent);cursor:pointer;display:none">Select all shown</span>
      </div>
    </div>
    <div id="txn-list"></div>
    <div id="bulk-bar"></div>
  </section>
  <section class="view" id="view-budget"><div id="budget-body"></div></section>
  <section class="view" id="view-trends"><div id="trends-body"></div></section>
  <section class="view" id="view-projects"><div id="projects-body"></div></section>
  <section class="view" id="view-finances"><div id="finances-body"></div></section>
  <section class="view" id="view-accounts"><div id="accounts-body"></div></section>
</div>
<nav>
  <button class="active" data-v="categorize"><span class="dot">◎</span>Review</button>
  <button data-v="budget"><span class="dot">▤</span>Budget</button>
  <button data-v="trends"><span class="dot">◪</span>Trends</button>
  <button data-v="projects"><span class="dot">◫</span>Projects</button>
  <button data-v="finances"><span class="dot">◈</span>Finances</button>
  <button data-v="accounts"><span class="dot">⬡</span>Accounts</button>
</nav>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxcRTPMFiNWlMFH_Fr0z-Ys3fG7KQwR-J6-QHotqbILfrZWIl5qCA1IRoUtsA7fC5U/exec';

let cats = [], txns = [], months = [], projects = [];
let manageMode = false;
const now = new Date();
let selMonth = now.toLocaleString('en-US', { month: 'long' });
let selYear  = now.getFullYear();

const money = n => '$' + Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = n => (Number(n) < 0 ? '−' : '') + money(n);
const moneyShort = n => '$' + Math.round(Math.abs(Number(n) || 0)).toLocaleString();
const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function get(action, params = {}) {
  const u = new URL(API); u.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
  return (await fetch(u)).json();
}
async function post(body) {
  const r = await (await fetch(API, { method:'POST', body: JSON.stringify(body) })).json();
  // An unrouted action used to fail silently. Now it says so.
  if (r && typeof r.error === 'string' && r.error.indexOf('Unknown action') === 0) {
    alert(r.error + '\n\nThe deployed script is out of date. Redeploy a new version.');
  }
  return r;
}

// ---------- cache ----------
// Tabs render from cache instantly, then quietly refresh behind the scenes.
// Anything that writes to the sheet clears it.
const CACHE_PREFIX = 'cbudget:';
const CACHE_TTL = 10 * 60 * 1000;

function cacheGet(key) {
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (Date.now() - o.t > CACHE_TTL) return null;
    return o.v;
  } catch (e) { return null; }
}
function cacheSet(key, val) {
  try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ t: Date.now(), v: val })); }
  catch (e) {}
}
function cacheBust(prefix) {
  try {
    Object.keys(localStorage)
      .filter(k => k.indexOf(CACHE_PREFIX) === 0 && (!prefix || k.indexOf(CACHE_PREFIX + prefix) === 0))
      .forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}

// Renders from cache if present, then fetches and re-renders only if the
// data actually changed. render() is called with the payload.
async function cachedLoad(key, fetcher, render) {
  const hit = cacheGet(key);
  if (hit) render(hit, true);
  const fresh = await fetcher();
  cacheSet(key, fresh);
  if (!hit || JSON.stringify(hit) !== JSON.stringify(fresh)) render(fresh, false);
  return fresh;
}

// Quietly warms the other tabs so switching feels instant.
function prefetch() {
  setTimeout(async () => {
    try {
      const bk = 'budget:' + selMonth + selYear;
      if (!cacheGet(bk)) cacheSet(bk, await get('budgetBundle', { month:selMonth, year:selYear }));
      if (!cacheGet('finances')) cacheSet('finances', await get('getFinanceReview'));
      if (!cacheGet('accounts')) cacheSet('accounts', await get('accountsBundle'));
      if (!cacheGet('trends')) cacheSet('trends', await get('getAllTrends', { months: 6 }));
    } catch (e) {}
  }, 400);
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('view-' + b.dataset.v).classList.add('active');
  window.scrollTo(0,0);
  if (b.dataset.v === 'budget') loadBudget();
  if (b.dataset.v === 'trends') loadCompare();
  if (b.dataset.v === 'projects') loadProjects();
  if (b.dataset.v === 'finances') loadFinances();
  if (b.dataset.v === 'accounts') loadAccounts();
});

function renderTxns() {
  const el = document.getElementById('txn-list');
  const todo = filters.status === 'todo';
  document.getElementById('subtitle').textContent =
    todo ? (totalMatching ? totalMatching + ' to categorize' : 'All caught up') : totalMatching + ' transactions';
  document.getElementById('f-count').textContent =
    totalMatching > txns.length ? 'Showing ' + txns.length + ' of ' + totalMatching : '';

  if (!txns.length) {
    el.innerHTML = todo
      ? '<div class="empty"><b>Nothing to categorize</b>Tap Sync to pull anything new.</div>'
      : (filters.status === 'pending'
        ? '<div class="empty"><b>Nothing pending</b>Charges appear here until the bank posts them.</div>'
        : '<div class="empty"><b>No matches</b>Try widening the filters.</div>');
    renderBulkBar();
    return;
  }

  const byUse = (a,b) => (b.used||0) - (a.used||0);
  const expense  = cats.filter(c => c.type === 'Expense').sort(byUse);
  const savings  = cats.filter(c => c.type === 'Savings').sort(byUse);
  const incomeC  = cats.filter(c => c.type === 'Income').sort(byUse);
  const excluded = cats.filter(c => c.type === 'Excluded').sort(byUse);
  const ordered = [...expense, ...savings, ...incomeC, ...excluded];

  const chipFor = (c, cls) => `<div class="chip ${cls}" data-c="${esc(c.name)}">${esc(c.name)}</div>`;
  let chipsHtml = expense.map(c => chipFor(c, '')).join('');
  if (savings.length)  chipsHtml += `<div class="chip-div">Savings envelopes</div>` + savings.map(c => chipFor(c, 'save')).join('');
  if (incomeC.length)  chipsHtml += `<div class="chip-div">Income</div>` + incomeC.map(c => chipFor(c, 'save')).join('');
  if (excluded.length) chipsHtml += `<div class="chip-div">Not budgeted</div>` + excluded.map(c => chipFor(c, 'excl')).join('');

  const optsHtml = ordered.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  const typeOf = {}; cats.forEach(c => typeOf[c.name] = c.type);

  el.innerHTML = txns.map(t => {
    const done = !!t.category;
    const sug = !done && t.suggested ? t.suggested : '';
    const sel = picked.has(t.transactionId);
    return `
    <div class="card ${pickMode ? 'pick-mode':''} ${sel ? 'picked':''}"
         data-id="${esc(t.transactionId)}" data-amt="${Math.abs(t.amount)}" data-done="${done}"
         ${sug ? `data-pick="${esc(sug)}"` : ''}>
      <div class="txn-head">
        ${pickMode ? '<div class="pick-dot"></div>' : ''}
        <div style="flex:1;min-width:0"><div class="txn-payee">${esc(t.payee)}</div>
        <div class="txn-meta">${fmtDate(t.date)} · ${esc(t.institution)}${t.card ? ' · ' + esc(t.card) : ''}${
          t.pending ? ' · <span style="color:var(--warn)">pending</span>' : ''}</div></div>
        <div class="txn-amt ${t.amount > 0 ? 'in':''}">${t.amount > 0 ? '+':''}${money(t.amount)}</div>
      </div>
      ${done ? `<div style="margin-top:9px">
          <span class="cat-badge ${typeOf[t.category] === 'Excluded' ? 'excl':''}">${esc(t.category)}</span>
          ${t.source === 'auto' ? '<span class="auto-tag">auto</span>' : ''}
          ${t.source === 'split' ? '<span class="auto-tag">split</span>' : ''}
          ${t.project ? '<span class="prj-tag">' + esc(t.project) + '</span>' : ''}
          <span class="clear-cat">Uncategorize</span>
        </div>` : ''}
      <div class="chips" style="${done || pickMode ? 'display:none' : ''}">${chipsHtml}</div>
      ${projects.length ? `<div class="prj-row" style="${pickMode ? 'display:none' : ''}">
        <span class="prj-label">Project</span>
        <select class="prj-pick">
          <option value="">none</option>
          ${projects.map(p => `<option value="${esc(p)}" ${t.project === p ? 'selected':''}>${esc(p)}</option>`).join('')}
        </select></div>` : ''}
      <div class="save-row" style="${done || pickMode ? 'display:none' : ''}">
        <span class="split-link" style="margin-top:0">Split</span>
        <span class="save-pick">${sug
          ? 'Suggested <b>' + esc(sug) + '</b>' + (t.suggestSeen > 1 ? ' · seen ' + t.suggestSeen + '×' : '')
          : 'Pick a category'}</span>
      </div>
      <div class="split-box" style="display:none" data-opts='${optsHtml.replace(/'/g, "&#39;")}'></div>
    </div>`;
  }).join('');

  if (pickMode) {
    el.querySelectorAll('.card').forEach(card => card.onclick = () => {
      const id = card.dataset.id;
      if (picked.has(id)) picked.delete(id); else picked.add(id);
      card.classList.toggle('picked');
      renderBulkBar();
    });
    renderBulkBar();
    return;
  }
  renderBulkBar();

  el.querySelectorAll('.prj-pick').forEach(sel => sel.onchange = async () => {
    const card = sel.closest('.card');
    if (card.dataset.done === 'true') {
      await post({ action:'setProject', transactionId:card.dataset.id, project: sel.value });
      cacheBust();
    }
  });

  el.querySelectorAll('.clear-cat').forEach(x => x.onclick = async () => {
    const card = x.closest('.card'); const id = card.dataset.id;
    card.style.opacity = '.35';
    await post({ action:'saveCategory', transactionId:id, category:'' });
    cacheBust();
    const t = txns.find(y => y.transactionId === id);
    if (filters.status === 'todo' || filters.status === 'all') {
      if (t) { t.category = ''; t.source = ''; }
    } else {
      txns = txns.filter(y => y.transactionId !== id); totalMatching--;
    }
    renderTxns();
  });

  el.querySelectorAll('.chip').forEach(chip => chip.onclick = () => selectChip(chip));

  // A suggested chip arrives already selected, with Save sitting next to it.
  el.querySelectorAll('.card').forEach(card => {
    const pick = card.dataset.pick;
    if (!pick || card.dataset.done === 'true') return;
    const chip = [...card.querySelectorAll('.chip')].find(c => c.dataset.c === pick);
    if (chip) selectChip(chip, true);
  });

  el.querySelectorAll('.split-link').forEach(link => link.onclick = () => {
    const card = link.closest('.card');
    const box = card.querySelector('.split-box');
    if (box.style.display === 'none') { openSplit(card, box); link.textContent = 'Cancel'; }
    else {
      box.style.display = 'none'; box.innerHTML = '';
      card.querySelector('.chips').style.display = '';
      card.querySelector('.save-pick').style.display = '';
      link.textContent = 'Split';
    }
  });
}

// Selecting a chip drops a Save button right beside it, so the commit is
// wherever your finger or cursor already is.
function selectChip(chip, isSuggestion) {
  const card = chip.closest('.card');
  card.querySelectorAll('.chip').forEach(c => c.classList.remove('sel','sug'));
  const old = card.querySelector('.chip-save');
  if (old) old.remove();

  chip.classList.add(isSuggestion ? 'sug' : 'sel');
  card.dataset.pick = chip.dataset.c;
  const pickEl = card.querySelector('.save-pick');
  if (pickEl && !isSuggestion) pickEl.innerHTML = '<b>' + esc(chip.dataset.c) + '</b>';

  const btn = document.createElement('button');
  btn.className = 'chip-save';
  btn.textContent = 'Save';
  btn.onclick = (ev) => { ev.stopPropagation(); commitCard(card); };
  chip.insertAdjacentElement('afterend', btn);
}

// Optimistic: the card leaves the queue straight away and the write happens
// behind it. A failure puts it back and says so.
let inFlight = 0;
function commitCard(card) {
  const id = card.dataset.id;
  const pick = card.dataset.pick;
  if (!pick) return;
  const prjEl = card.querySelector('.prj-pick');
  const project = prjEl ? prjEl.value : null;
  const snapshot = txns.find(x => x.transactionId === id);

  if (filters.status === 'todo') {
    txns = txns.filter(x => x.transactionId !== id);
    totalMatching--;
  } else if (snapshot) {
    snapshot.category = pick; snapshot.source = 'manual';
    if (project !== null) snapshot.project = project;
  }
  renderTxns();

  inFlight++;
  post({ action:'saveCategory', transactionId:id, category:pick })
    .then(r => {
      if (r && r.error) throw new Error(r.error);
      if (project) return post({ action:'setProject', transactionId:id, project: project });
    })
    .catch(err => {
      alert('Could not save that one: ' + err.message);
      if (snapshot && !txns.some(x => x.transactionId === id)) {
        txns.unshift(snapshot); totalMatching++; renderTxns();
      }
    })
    .finally(() => { inFlight--; cacheBust(); });
}

// Drag to reorder. Pointer events rather than HTML5 drag and drop, which
// does not fire on touch devices.
function enableDrag(container) {
  if (!container) return;
  let row = null, rows = [], startY = 0, offset = 0, moved = false;

  container.querySelectorAll('.grip').forEach(grip => {
    grip.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      row = grip.closest('.mrow');
      rows = [...container.querySelectorAll('.mrow')];
      startY = e.clientY;
      offset = 0; moved = false;
      row.classList.add('dragging');
      grip.setPointerCapture(e.pointerId);
    });

    grip.addEventListener('pointermove', (e) => {
      if (!row) return;
      offset = e.clientY - startY;
      row.style.transform = 'translateY(' + offset + 'px)';
      if (Math.abs(offset) > 4) moved = true;

      const box = row.getBoundingClientRect();
      const mid = box.top + box.height / 2;
      const others = rows.filter(r => r !== row);

      for (const other of others) {
        const b = other.getBoundingClientRect();
        const otherMid = b.top + b.height / 2;
        if (offset < 0 && mid < otherMid && other.compareDocumentPosition(row) & Node.DOCUMENT_POSITION_FOLLOWING) {
          other.parentNode.insertBefore(row, other);
          startY = e.clientY; offset = 0; row.style.transform = '';
          break;
        }
        if (offset > 0 && mid > otherMid && other.compareDocumentPosition(row) & Node.DOCUMENT_POSITION_PRECEDING) {
          other.parentNode.insertBefore(row, other.nextSibling);
          startY = e.clientY; offset = 0; row.style.transform = '';
          break;
        }
      }
    });

    const finish = async () => {
      if (!row) return;
      row.classList.remove('dragging');
      row.style.transform = '';
      const dragged = row;
      row = null;
      if (!moved) return;
      const names = [...container.querySelectorAll('.mrow')].map(r => r.dataset.cat);
      dragged.classList.add('just-moved');
      setTimeout(() => dragged.classList.remove('just-moved'), 500);
      const res = await post({ action:'setCategoryOrder', names: names });
      if (res.error) { alert(res.error); loadBudget(); return; }
      cacheBust();
    };
    grip.addEventListener('pointerup', finish);
    grip.addEventListener('pointercancel', finish);
  });
}

function openSplit(card, box) {
  card.querySelector('.chips').style.display = 'none';
  card.querySelector('.save-pick').style.display = 'none';
  const cs = card.querySelector('.chip-save');
  if (cs) cs.remove();
  box.style.display = 'block';
  const total = Number(card.dataset.amt);
  const opts = box.dataset.opts;

  box.innerHTML = `
    <div class="split-rows"></div>
    <div class="split-foot">
      <span class="split-tally"></span>
      <span style="display:flex;gap:6px">
        <button class="add">Add part</button>
        <button class="go">Save split</button>
      </span>
    </div>`;

  const rowsEl = box.querySelector('.split-rows');
  const addLine = (amt) => {
    const div = document.createElement('div');
    div.className = 'split-line';
    div.innerHTML = `<select>${opts}</select>
      <input type="number" step="0.01" placeholder="0.00" value="${amt != null ? amt : ''}">
      <span class="rm">×</span>`;
    div.querySelector('.rm').onclick = () => { div.remove(); tally(); };
    div.querySelector('input').oninput = tally;
    rowsEl.appendChild(div);
    tally();
  };

  function tally() {
    const vals = [...rowsEl.querySelectorAll('input')].map(i => Number(i.value) || 0);
    const sum = vals.reduce((a,b) => a + b, 0);
    const diff = total - sum;
    const t = box.querySelector('.split-tally');
    t.textContent = Math.abs(diff) < 0.01
      ? '$' + total.toFixed(2) + ' allocated'
      : '$' + Math.abs(diff).toFixed(2) + (diff > 0 ? ' left' : ' over');
    t.className = 'split-tally' + (Math.abs(diff) < 0.01 ? '' : ' bad');
  }

  addLine((total / 2).toFixed(2));
  addLine((total / 2).toFixed(2));
  box.querySelector('.add').onclick = () => addLine();

  box.querySelector('.go').onclick = async () => {
    const splits = [...rowsEl.querySelectorAll('.split-line')].map(l => ({
      category: l.querySelector('select').value,
      amount: Number(l.querySelector('input').value) || 0
    })).filter(s => s.amount > 0);
    if (splits.length < 2) { alert('A split needs at least two parts with amounts.'); return; }
    const id = card.dataset.id;
    const r = await post({ action:'splitTransaction', transactionId:id, splits:splits });
    if (r.error) { alert(r.error); return; }
    cacheBust();
    card.style.opacity = '.35';
    setTimeout(() => { txns = txns.filter(t => t.transactionId !== id); renderTxns(); }, 220);
  };
}

async function loadBudget() {

function renderBudgetBundle(d) {
  const el = document.getElementById('budget-body');
  months = d.months || [];
  const budget = d.budget, vaults = d.vaults, accts = d.byAccount;

  if (!months.some(m => m.month === selMonth && m.year === selYear)) {
    months = [{ month: selMonth, year: selYear, label: selMonth + ' ' + selYear }, ...months];
  }

  const picker = `<div class="months">` + (months.length ? months.map(m =>
    `<div class="mpill ${m.month===selMonth && m.year===selYear ? 'on':''}"
      data-m="${m.month}" data-y="${m.year}">${m.month.slice(0,3)} ${String(m.year).slice(2)}</div>`
  ).join('') : '') + `</div>`;

  if (budget.error) {
    el.innerHTML = picker + `<div class="empty"><b>No budget for ${selMonth} ${selYear}</b>Run setupCurrentMonth() in Apps Script.</div>`;
    bindPicker(); return;
  }

  const expenses = budget.filter(b => b.type === 'Expense');
  const savings  = budget.filter(b => b.type === 'Savings');
  const income   = budget.filter(b => b.type === 'Income');
  const outflow  = expenses.concat(savings);
  const tBud = outflow.reduce((s,b) => s + b.budgeted, 0);
  const tSpent = outflow.reduce((s,b) => s + b.spent, 0);
  const left = tBud - tSpent;
  const incBud = income.reduce((s,b) => s + b.budgeted, 0);
  const incGot = income.reduce((s,b) => s + b.spent, 0);

  const expBud = expenses.reduce((s,b) => s + b.budgeted, 0);
  const expAct = expenses.reduce((s,b) => s + b.spent, 0);
  const savBud = savings.reduce((s,b) => s + b.budgeted, 0);
  const savAct = savings.reduce((s,b) => s + b.spent, 0);
  const planned = incBud - expBud - savBud;
  const actual  = incGot - expAct - savAct;

  const flowRow = (label, bud, act, bold) => `
    <div class="flow ${bold ? 'flow-total':''}">
      <span class="fl">${label}</span>
      <span class="fv">${signed(bud)}</span>
      <span class="fv">${signed(act)}</span>
    </div>`;

  let html = picker + `
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <span id="manage-toggle" style="font-size:12.5px;color:var(--accent);cursor:pointer">${
        manageMode ? 'Done' : 'Reorder & edit'}</span>
    </div>
    <div class="card">
      <div class="flow flow-head"><span class="fl"></span><span class="fv">Budget</span><span class="fv">Actual</span></div>
      ${flowRow('Income', incBud, incGot)}
      ${flowRow('Expenses', -expBud, -expAct)}
      ${flowRow('Savings', -savBud, -savAct)}
      <div class="flow flow-total">
        <span class="fl">Remaining</span>
        <span class="fv" style="color:${planned < 0 ? 'var(--over)':'var(--text)'}">${signed(planned)}</span>
        <span class="fv" style="color:${actual < 0 ? 'var(--over)':'var(--good)'}">${signed(actual)}</span>
      </div>
    </div>
    ${manageMode ? '' : `<div class="card">${donut(expenses)}</div>`}`;

  if (manageMode) {
    // One list, so a category can be dragged past a section boundary and
    // switched between Expense, Savings and Income in the same pass.
    html += `<div class="section-label">All categories</div>
      <div class="card tight" id="manage-list">${budget.map(row).join('')}</div>`;
  } else {
    if (income.length) html += `<div class="section-label">Income</div>
      <div class="card tight">${income.map(incomeRow).join('')}
        ${incBud ? `<div class="fcount" style="padding:6px 0">${
          money(incGot)} received of ${money(incBud)} expected${
          incGot >= incBud ? '' : ' · ' + money(incBud - incGot) + ' to come'}</div>` : ''}
      </div>`;
    html += `<div class="section-label">Spending</div>
      <div class="card tight">${expenses.map(row).join('')}</div>`;
    if (savings.length) html += `<div class="section-label">Savings contributions</div>
      <div class="card tight">${savings.map(row).join('')}</div>`;
  }

  if (!manageMode && vaults && vaults.length) html += `<div class="section-label">Envelope balances</div>
    <div class="card tight">` + vaults.map(v => `
      <div class="lrow"><div><div class="nm">${esc(v.name)}</div>
        <div class="sb">${money(v.contributed)} in · ${money(v.spent)} spent</div></div>
        <div class="vl" style="color:var(--good)">${money(v.balance)}</div></div>`).join('') + `</div>
`;

  if (!manageMode && accts && accts.length) html += `<div class="section-label">By card</div>
    <div class="card tight">` + accts.map(a => `
      <div class="lrow"><div><div class="nm">${esc(a.card)}</div>
        <div class="sb">${esc(a.institution)}</div></div>
        <div class="vl">${money(a.spent)}</div></div>`).join('') + `</div>`;

  html += `<div class="section-label">Add a category</div>
    <div class="card">
      <label>Name</label><input type="text" id="c-name" placeholder="Subscriptions">
      <label>Monthly amount</label><input type="number" id="c-amt" placeholder="0">
      <label>Type</label>
      <select id="c-type">
        <option value="Expense">Expense — counts against budget</option>
        <option value="Savings">Savings — builds an envelope</option>
        <option value="Income">Income — expected inflow</option>
        <option value="Excluded">Excluded — ignore (transfers, CC payments)</option>
      </select>
      <button class="btn ghost" id="c-add">Add category</button>
    </div>`;

  el.innerHTML = html;
  bindPicker();
  document.getElementById('manage-toggle').onclick = () => { manageMode = !manageMode; loadBudget(); };
  el.querySelectorAll('.brow').forEach(r => r.onclick = () => openCategoryMonth(r.dataset.cat, selMonth, selYear));
  document.getElementById('c-add').onclick = addCategory;

  if (manageMode) enableDrag(document.getElementById('manage-list'));
  el.querySelectorAll('.mamt').forEach(inp => inp.onchange = async () => {
    const name = inp.closest('.mrow').dataset.cat;
    const amt = Number(inp.value) || 0;
    // Update this month and the default that future months inherit.
    await post({ action:'updateBudget', month:selMonth, year:selYear, category:name, amount:amt });
    await post({ action:'updateCategory', name:name, budget:amt });
    cacheBust();
  });
  el.querySelectorAll('.mtype').forEach(sel => sel.onchange = async () => {
    const name = sel.closest('.mrow').dataset.cat;
    await post({ action:'updateCategory', name:name, type: sel.value });
    cacheBust(); loadBudget();
  });
  el.querySelectorAll('.mdel').forEach(x => x.onclick = async () => {
    const name = x.closest('.mrow').dataset.cat;
    if (!confirm('Remove ' + name + ' from the budget?')) return;
    const r = await post({ action:'deleteCategory', name:name });
    if (r.error) {
      if (confirm(r.error + '\n\nRemove it from just this month instead?')) {
        await post({ action:'removeFromMonth', month:selMonth, year:selYear, name:name });
      } else return;
    }
    cacheBust(); loadBudget();
  });
}

function bindPicker() {
  document.querySelectorAll('#view-budget .mpill').forEach(p => p.onclick = () => {
    selMonth = p.dataset.m; selYear = Number(p.dataset.y); loadBudget();
  });
}

function incomeRow(b) {
  const pct = b.budgeted > 0 ? Math.min(100, (b.spent / b.budgeted) * 100) : 0;
  return `<div class="brow" data-cat="${esc(b.category)}">
    <div class="brow-top"><span class="brow-cat">${esc(b.category)}</span>
      <span class="brow-num"><b>${money(b.spent)}</b> of ${money(b.budgeted)}</span></div>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
}

function row(b) {
  const pct = b.budgeted > 0 ? Math.min(100, (b.spent / b.budgeted) * 100) : 0;
  const cls = b.budgeted > 0 && b.spent > b.budgeted ? 'over' : (pct > 85 ? 'warn' : '');

  if (manageMode) {
    return `<div class="mrow" data-cat="${esc(b.category)}">
      <span class="grip">⠿</span>
      <span class="mname">${esc(b.category)}</span>
      <select class="mtype">
        <option value="Expense" ${b.type === 'Expense' ? 'selected':''}>Expense</option>
        <option value="Savings" ${b.type === 'Savings' ? 'selected':''}>Savings</option>
        <option value="Income"  ${b.type === 'Income'  ? 'selected':''}>Income</option>
      </select>
      <input class="mamt" type="number" value="${b.budgeted || ''}" placeholder="0">
      <span class="mdel">×</span>
    </div>`;
  }

  return `<div class="brow" data-cat="${esc(b.category)}">
    <div class="brow-top"><span class="brow-cat">${esc(b.category)}</span>
      <span class="brow-num"><b>${money(b.spent)}</b> / ${money(b.budgeted)}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
}

function donut(rows) {
  const data = rows.filter(r => r.spent > 0).sort((a,b) => b.spent - a.spent).slice(0,6);
  const total = data.reduce((s,d) => s + d.spent, 0);
  if (!total) return '<div class="empty" style="padding:20px">Nothing spent yet.</div>';
  const shades = ['#45688E','#5D9078','#C79553','#8A7CA8','#7E9EB8','#B8676C'];
  const R = 52, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = data.map((d,i) => {
    const len = (d.spent / total) * C;
    const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${shades[i%6]}" stroke-width="17"
      stroke-dasharray="${len-1.5} ${C-len+1.5}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off += len; return s;
  }).join('');
  const legend = data.map((d,i) => `
    <div style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:5px">
      <span style="width:9px;height:9px;border-radius:2px;background:${shades[i%6]};flex:none"></span>
      <span style="flex:1">${esc(d.category)}</span>
      <span style="color:var(--muted);font-variant-numeric:tabular-nums">${money(d.spent)}</span></div>`).join('');
  return `<div style="display:flex;gap:14px;align-items:center">
    <svg width="140" height="140" viewBox="0 0 140 140" style="flex:none">${arcs}
      <text x="70" y="66" text-anchor="middle" font-size="17" font-weight="600" fill="#23262A">${moneyShort(total)}</text>
      <text x="70" y="82" text-anchor="middle" font-size="10.5" fill="#767B82">spent</text></svg>
    <div style="flex:1">${legend}</div></div>`;
}

async function addCategory() {
  const name = document.getElementById('c-name').value.trim();
  const amt = Number(document.getElementById('c-amt').value) || 0;
  const type = document.getElementById('c-type').value;
  if (!name) { alert('Give the category a name.'); return; }
  if (type !== 'Excluded' && !amt) { alert('Give it a monthly amount.'); return; }
  const r = await post({ action:'addCategory', category:name, defaultAmount:amt, type:type });
  if (r.error) { alert(r.error); return; }
  cats = await get('getCategories'); cacheBust(); loadBudget();
}

// What actually makes up a category's number for one month.
async function openCategoryMonth(category, month, year) {
  showView('budget');
  const el = document.getElementById('budget-body');
  el.innerHTML = '<div class="empty">Loading</div>';
  const d = await get('getCategoryMonth', { category: category, month: month, year: year });

  const pct = d.budgeted > 0 ? Math.min(100, (d.spent / d.budgeted) * 100) : 0;
  const over = d.budgeted > 0 && d.spent > d.budgeted;
  const isIncome = d.type === 'Income';

  el.innerHTML = `
    <span class="back" id="back-cat">← ${esc(month)} ${year}</span>
    <div class="card">
      <div style="font-size:12.5px;color:var(--muted)">${esc(month)} ${year}${
        d.type !== 'Expense' ? ' · ' + esc(d.type) : ''}</div>
      <div style="font-size:22px;font-weight:620;letter-spacing:-.02em;margin:2px 0 4px">${money(d.spent)}</div>
      <div style="font-size:15px;font-weight:500;margin-bottom:${d.budgeted ? '10px':'0'}">${esc(category)}</div>
      ${d.budgeted ? `<div class="track"><div class="fill ${over ? 'over' : (pct > 85 ? 'warn':'')}"
          style="width:${pct}%"></div></div>
        <div class="fcount" style="margin-top:6px">${
          isIncome
            ? money(d.spent) + ' of ' + money(d.budgeted) + ' expected'
            : (over ? money(d.spent - d.budgeted) + ' over ' + money(d.budgeted)
                    : money(d.budgeted - d.spent) + ' left of ' + money(d.budgeted))}</div>` : ''}
    </div>
    ${d.transactions.length ? `<div class="section-label">${d.transactions.length} transaction${
      d.transactions.length === 1 ? '' : 's'}</div>
      <div class="card tight">${d.transactions.map(t => `
        <div class="lrow"><div style="flex:1;min-width:0">
          <div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.payee)}</div>
          <div class="sb">${fmtDue(t.date)}${t.card ? ' · ' + esc(t.card) : ''}${
            t.project ? ' · ' + esc(t.project) : ''}</div></div>
          <div class="vl" style="font-size:14px;color:${t.amount > 0 ? 'var(--good)':'var(--text)'}">${
            t.amount > 0 ? '+' : ''}${money(t.amount)}</div></div>`).join('')}</div>`

    <div class="card"><button class="btn ghost" id="cat-trend">See the last 6 months</button></div>`;

  document.getElementById('back-cat').onclick = loadBudget;
  document.getElementById('cat-trend').onclick = () => openTrend(category);

function showView(name) {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));

// ============ COMPARE (all months, all categories) ============
async function loadCompare() {
  const el = document.getElementById('trends-body');
  if (!cacheGet('trends')) el.innerHTML = '<div class="empty">Loading</div>';
  await cachedLoad('trends', () => get('getAllTrends', { months: 6 }), renderCompare);
}

function renderCompare(t) {
  const el = document.getElementById('trends-body');
  if (t.error) { el.innerHTML = '<div class="empty"><b>No data yet</b>' + esc(t.error) + '</div>'; return; }

  const anySpend = t.totals.some(x => x.spent > 0);
  if (!anySpend) { el.innerHTML = '<div class="empty"><b>Nothing to compare yet</b>Categorize a few transactions first.</div>'; return; }

  // household totals over time
  let html = `<div class="section-label">Household, last ${t.months.length} months</div>
    <div class="card">${totalsChart(t)}</div>`;

  // flag categories trending over
  const flagged = t.categories.filter(c => {
    const withB = c.data.filter(d => d.budgeted != null && d.budgeted > 0);
    if (withB.length < 3) return false;
    return withB.filter(d => d.spent > d.budgeted).length >= Math.ceil(withB.length * 0.6);
  });
  if (flagged.length) {
    html += `<div class="note flag"><b>Running over consistently:</b> ${flagged.map(f => esc(f.name)).join(', ')}.
      Either these budgets are too low or they are the ones to pull back on.</div>`;
  }

  html += `<div class="section-label">Every category<span>tap to drill in</span></div><div class="card tight">`;
  html += t.categories
    .map(c => ({ c, tot: c.data.reduce((s,d) => s + d.spent, 0) }))
    .sort((a,b) => b.tot - a.tot)
    .map(({ c }) => {
      const last = c.data[c.data.length - 1];
      const active = c.data.filter(d => d.spent > 0);
      const avg = active.length ? active.reduce((s,d) => s + d.spent, 0) / active.length : 0;
      const over = last.budgeted && last.spent > last.budgeted;
      return `<div class="spark-row" data-cat="${esc(c.name)}">
        <div class="spark-name"><div class="n">${esc(c.name)}</div>
          <div class="d ${over ? 'bad':''}">${money(last.spent)} this month · ${money(avg)} avg</div></div>
        ${sparkline(c.data)}
      </div>`;
    }).join('');
  html += `</div>`;

  el.innerHTML = html;
  el.querySelectorAll('.spark-row').forEach(r => r.onclick = () => openTrend(r.dataset.cat));
}

function totalsChart(t) {
  const W = 320, H = 150, pad = 24;
  const max = Math.max(...t.totals.map(x => Math.max(x.spent, x.budgeted)), 1);
  const bw = (W - pad * 2) / t.totals.length;
  const bars = t.totals.map((x,i) => {
    const bx = pad + i * bw;
    const sw = bw * 0.30, gap = bw * 0.06;
    const sh = (x.spent / max) * (H - 42), bh = (x.budgeted / max) * (H - 42);
    const over = x.spent > x.budgeted && x.budgeted > 0;
    return `
      <rect x="${bx + bw/2 - sw - gap/2}" y="${H-22-bh}" width="${sw}" height="${Math.max(bh,1)}" rx="3" fill="#D8D5CF"/>
      <rect x="${bx + bw/2 + gap/2}" y="${H-22-sh}" width="${sw}" height="${Math.max(sh,1)}" rx="3"
        fill="${over ? '#B8676C':'#45688E'}"/>
      <text x="${bx + bw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="#767B82">${t.months[i].label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${bars}</svg>
    <div style="display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px;justify-content:center">
      <span><span style="display:inline-block;width:9px;height:9px;background:#D8D5CF;border-radius:2px;margin-right:5px"></span>Budgeted</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:#45688E;border-radius:2px;margin-right:5px"></span>Spent</span>
    </div>`;
}

function sparkline(data) {
  const W = 76, H = 26;
  const max = Math.max(...data.map(d => Math.max(d.spent, d.budgeted || 0)), 1);
  const bw = W / data.length;
  const bars = data.map((d,i) => {
    const h = (d.spent / max) * (H - 4);
    const over = d.budgeted && d.spent > d.budgeted;
    return `<rect x="${i*bw+1}" y="${H-h}" width="${bw-2}" height="${Math.max(h,1)}" rx="1.5"
      fill="${over ? '#B8676C':'#45688E'}" opacity="${i===data.length-1 ? 1 : .5}"/>`;
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="flex:none">${bars}</svg>`;
}

async function openTrend(category) {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelector('nav button[data-v="trends"]').classList.add('active');
  document.getElementById('view-trends').classList.add('active');
  window.scrollTo(0,0);

  const el = document.getElementById('trends-body');
  el.innerHTML = '<div class="empty">Loading</div>';
  const series = await get('getCategoryTrend', { category:category, months:6 });

  const withB = series.filter(s => s.budgeted != null && s.budgeted > 0);
  const overs = withB.filter(s => s.spent > s.budgeted).length;
  const active = series.filter(s => s.spent > 0);
  const avg = active.length ? active.reduce((s,x) => s + x.spent, 0) / active.length : 0;
  const curB = withB.length ? withB[withB.length-1].budgeted : 0;

  let advice = '';
  if (withB.length >= 3 && overs >= Math.ceil(withB.length * 0.6)) {
    advice = `<div class="note flag">Over budget in ${overs} of the last ${withB.length} months.
      Average is ${money(avg)} against a ${money(curB)} budget. Raising it to about ${money(Math.ceil(avg/25)*25)} would match reality.</div>`;
  } else if (active.length >= 3 && curB > 0 && avg < curB * 0.6) {
    advice = `<div class="note">Consistently under. Average is ${money(avg)} against ${money(curB)},
      so roughly ${money(curB - avg)} a month could move elsewhere.</div>`;
  }

  el.innerHTML = `
    <span class="back" id="back">← All categories</span>
    <div class="card">
      <div style="font-size:16px;font-weight:600;margin-bottom:2px">${esc(category)}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Last 6 months</div>
      ${bars(series)}
    </div>
    ${advice}
    <div class="card tight">${series.map(s => `
      <div class="lrow acct-row" data-m="${esc(s.month || '')}" data-y="${s.year || ''}">
        <div class="nm">${esc(s.label)}</div>
        <div class="vl" style="color:${s.budgeted && s.spent > s.budgeted ? 'var(--over)':'var(--text)'}">
          ${money(s.spent)}${s.budgeted ? ' <span style="color:var(--faint);font-weight:400">/ ' + money(s.budgeted) + '</span>':''}
        </div></div>`).join('')}</div>`;

  el.querySelectorAll('.acct-row').forEach(r => r.onclick = () => {
    if (r.dataset.m) openCategoryMonth(category, r.dataset.m, Number(r.dataset.y));
  });
  document.getElementById('back').onclick = loadCompare;
}

function bars(series) {
  const W = 300, H = 130, pad = 22;
  const max = Math.max(...series.map(s => Math.max(s.spent, s.budgeted || 0)), 1);
  const bw = (W - pad*2) / series.length;
  const b = series.map((s,i) => {
    const x = pad + i*bw + bw*0.18, w = bw*0.64;
    const h = (s.spent/max)*(H-40), y = H-20-h;
    const over = s.budgeted && s.spent > s.budgeted;
    return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="3"
      fill="${over ? '#B8676C':'#45688E'}" opacity="${i===series.length-1 ? 1 : .72}"/>
      <text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="#767B82">${s.label}</text>`;
  }).join('');
  const bd = [...series].reverse().find(s => s.budgeted != null && s.budgeted > 0);
  let line = '';
  if (bd) {
    const y = H-20-(bd.budgeted/max)*(H-40);
    line = `<line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" stroke="#767B82" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
      <text x="${W-pad}" y="${y-4}" text-anchor="end" font-size="9.5" fill="#767B82">budget ${moneyShort(bd.budgeted)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${line}${b}</svg>`;
}

// ============ PROJECTS ============
async function loadProjects() {
  const el = document.getElementById('projects-body');
  if (!cacheGet('projects')) el.innerHTML = '<div class="empty">Loading</div>';
  await cachedLoad('projects', () => get('getProjects'), renderProjects);
}

function renderProjects(list) {
  const el = document.getElementById('projects-body');
  const active = (list || []).filter(p => p.status !== 'Done');
  const done   = (list || []).filter(p => p.status === 'Done');

  const card = p => {
    const pct = p.budget > 0 ? Math.min(100, (p.spent / p.budget) * 100) : 0;
    const over = p.budget > 0 && p.spent > p.budget;
    return `<div class="brow" data-p="${esc(p.name)}">
      <div class="brow-top"><span class="brow-cat">${esc(p.name)}</span>
        <span class="brow-num"><b>${money(p.spent)}</b>${p.budget ? ' / ' + money(p.budget) : ''}</span></div>
      ${p.budget ? `<div class="track"><div class="fill ${over ? 'over' : (pct > 85 ? 'warn':'')}"
        style="width:${pct}%"></div></div>` : ''}
      <div class="sb" style="margin-top:4px">${p.count} purchase${p.count === 1 ? '' : 's'}${
        p.last ? ' · last ' + fmtDue(p.last) : ''}</div>
    </div>`;
  };

  el.innerHTML = `
    ${active.length ? `<div class="section-label">Active</div>
      <div class="card tight">${active.map(card).join('')}</div>` :
      '<div class="empty"><b>No projects yet</b>Create one, then tag purchases to it as you go.</div>'}
    ${done.length ? `<div class="section-label">Finished</div>
      <div class="card tight" style="opacity:.7">${done.map(card).join('')}</div>` : ''}
    <div class="section-label">New project</div>
    <div class="card">
      <label>Name</label><input type="text" id="p-name" placeholder="Basement finish">
      <label>Budget (optional)</label><input type="number" id="p-budget" placeholder="0">
      <button class="btn ghost" id="p-add">Create project</button>
    </div>`;

  el.querySelectorAll('.brow').forEach(r => r.onclick = () => openProject(r.dataset.p));
  document.getElementById('p-add').onclick = async () => {
    const name = document.getElementById('p-name').value.trim();
    const budget = Number(document.getElementById('p-budget').value) || 0;
    if (!name) { alert('Give the project a name.'); return; }
    const r = await post({ action:'addProject', name:name, budget:budget });
    if (r.error) { alert(r.error); return; }
    cacheBust();
    loadProjects();
  };
}

async function openProject(name) {

  el.innerHTML = `
    <span class="back" id="back-prj">← All projects</span>
    <div class="card">
      <div style="font-size:12.5px;color:var(--muted)">${esc(p.status)}${
        p.first ? ' · started ' + fmtDue(p.first) : ''}</div>
      <div style="font-size:22px;font-weight:620;letter-spacing:-.02em;margin:2px 0 4px">${money(p.spent)}</div>
      <div style="font-size:15px;font-weight:500;margin-bottom:${p.budget ? '10px':'0'}">${esc(p.name)}
        <span class="clear-cat" id="edit-prj">edit</span></div>
      ${p.budget ? `<div class="track"><div class="fill ${over ? 'over' : (pct > 85 ? 'warn':'')}"
          style="width:${pct}%"></div></div>
        <div class="fcount" style="margin-top:6px">${
          over ? money(p.spent - p.budget) + ' over budget' :
                 money(p.budget - p.spent) + ' left of ' + money(p.budget)}</div>` : ''}
    </div>
    ${d.byCategory.length ? `<div class="section-label">By category</div>
      <div class="card tight">${d.byCategory.map(c => `
        <div class="lrow"><div class="nm" style="font-weight:400">${esc(c.category)}</div>
          <div class="vl" style="font-size:14px">${money(c.spent)}</div></div>`).join('')}</div>` : ''}
    ${d.transactions.length ? `<div class="section-label">Purchases</div>
      <div class="card tight">${d.transactions.map(t => `
        <div class="lrow"><div style="flex:1;min-width:0">
          <div class="nm">${esc(t.payee)}</div>
          <div class="sb">${fmtDue(t.date)}${t.card ? ' · ' + esc(t.card) : ''}${
            t.category ? ' · ' + esc(t.category) : ''}</div></div>
          <div class="vl" style="font-size:14px">${money(t.amount)}</div></div>`).join('')}</div>`
      : '<div class="empty"><b>Nothing tagged yet</b>Assign purchases to this project from the Review tab.</div>'}
    <div class="card"><button class="btn ghost" id="prj-done">${
      p.status === 'Done' ? 'Reopen project' : 'Mark finished'}</button></div>`;

  document.getElementById('back-prj').onclick = loadProjects;
  document.getElementById('edit-prj').onclick = async () => {
    const b = prompt('Budget for this project', p.budget || '');
    if (b === null) return;
    await post({ action:'updateProject', name:p.name, budget: b.replace(/[^0-9.]/g,'') });
    cacheBust(); openProject(name);
  };
  document.getElementById('prj-done').onclick = async () => {
