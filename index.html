// ============ FINANCES ============
async function loadFinances() {
  const el = document.getElementById('finances-body');
  if (!cacheGet('finances')) el.innerHTML = '<div class="empty">Loading</div>';
  await cachedLoad('finances', () => get('getFinanceReview'), renderFinances);
}

function renderFinances(d) {
  const el = document.getElementById('finances-body');

  if (!d.groups || !d.groups.length) {
    el.innerHTML = `<div class="empty"><b>No balances yet</b>Pull them from your banks to get started.</div>
      <div class="card"><button class="btn" id="fin-refresh">Refresh balances</button></div>`;
    document.getElementById('fin-refresh').onclick = doRefreshFinances;
    return;
  }

  const t = d.totals;
  const soon = [];
  d.groups.forEach(g => g.accounts.forEach(a => { if (a.due) soon.push(Object.assign({ inst:g.institution }, a)); }));
  soon.sort((a,b) => new Date(a.due) - new Date(b.due));

  let html = `
    <div class="totals">
      <div><div class="lbl">Net worth</div>
        <div class="val" style="color:${t.net < 0 ? 'var(--over)':'var(--text)'}">${money(t.net)}</div></div>
      <div><div class="lbl">Owed</div>
        <div class="val" style="color:var(--over)">${money(t.credit + t.loans)}</div></div>
    </div>
    <div class="card tight">
      <div class="lrow"><div class="nm">Cash</div><div class="vl">${money(t.cash)}</div></div>
      ${t.invest ? `<div class="lrow"><div class="nm">Investments</div><div class="vl">${money(t.invest)}</div></div>` : ''}
      <div class="lrow"><div class="nm">Credit cards</div><div class="vl" style="color:var(--over)">${money(t.credit)}</div></div>
      ${t.loans ? `<div class="lrow"><div class="nm">Loans</div><div class="vl" style="color:var(--over)">${money(t.loans)}</div></div>` : ''}
    </div>`;

  if (soon.length) {
    html += `<div class="section-label">Payments due</div><div class="card tight">` +
      soon.map(a => {
        const days = Math.ceil((new Date(a.due + 'T12:00:00') - new Date()) / 86400000);
        const urgent = days <= 7 && days >= 0;
        // Cards owe the statement balance. For loans the realistic figure is
        // what actually cleared last cycle, which includes escrow; P&I alone
        // is shown inside the account.
        const owed = a.statement != null ? a.statement
                   : (a.lastPayment != null ? a.lastPayment : a.scheduled);
        const sub = [fmtDue(a.due)];
        sub.push(days >= 0 ? 'in ' + days + 'd' : Math.abs(days) + 'd ago');
        if (a.type === 'loan' && a.scheduled != null) sub.push('P&I ' + money(a.scheduled));
        return `<div class="lrow acct-row" data-id="${esc(a.id)}">
          <div style="flex:1;min-width:0"><div class="nm">${esc(a.name)}</div>
            <div class="sb">${sub.join(' · ')}</div></div>
          <div class="vl" style="color:${urgent ? 'var(--over)':'var(--text)'}">${
            owed != null ? money(owed) : '—'}</div>
        </div>`;
      }).join('') + `</div>`;
  }

  d.groups.forEach(g => {
    const hasCash = g.accounts.some(a => a.type === 'depository');
    html += `<div class="section-label">${esc(g.institution)}${
      hasCash ? '<span class="vault-hint">vault</span>' : ''}</div><div class="card tight">` +
      g.accounts.map(a => {
        const isDebt = a.type === 'credit' || a.type === 'loan';
        const sub = [];
        if (a.type === 'credit' && a.limit) sub.push(money(a.limit - a.balance) + ' available');
        else if (a.available != null && a.type === 'depository') sub.push(money(a.available) + ' available');
        if (a.apr) sub.push(a.apr + '% APR');
        if (a.statement != null) sub.push('stmt ' + money(a.statement));
        return `<div class="lrow acct-row" data-id="${esc(a.id)}">
          <div style="flex:1;min-width:0"><div class="nm">${esc(a.name)}</div>
            ${sub.length ? `<div class="sb">${sub.join(' · ')}</div>` : ''}</div>
          <div class="vl" style="color:${isDebt && a.balance > 0 ? 'var(--over)':'var(--text)'}">${money(a.balance)}</div>
          ${a.type === 'depository'
            ? `<span class="tgl ${a.role === 'Savings' ? 'on':''}" data-id="${esc(a.id)}"><span class="knob"></span></span>`
            : '<span class="tgl-gap"></span>'}
        </div>`;
      }).join('') + `</div>`;
  });

  html += `<div class="card"><button class="btn ghost" id="fin-refresh">Refresh balances</button>
    ${d.updated ? `<div class="fcount" style="text-align:center;margin-top:8px">Updated ${fmtWhen(d.updated)}</div>` : ''}
    </div>`;

  el.innerHTML = html + '<div id="role-bar"></div>';
  document.getElementById('fin-refresh').onclick = doRefreshFinances;
  el.querySelectorAll('.acct-row').forEach(r => r.onclick = () => openAccount(r.dataset.id));

  roleEdits = {};
  el.querySelectorAll('.tgl').forEach(t => t.onclick = (ev) => {
    ev.stopPropagation();                     // don't open the account
    const on = t.classList.toggle('on');
    roleEdits[t.dataset.id] = on ? 'Savings' : '';
    renderRoleBar();
  });
}

// Toggles stage until saved, because committing also retags history.
let roleEdits = {};
function renderRoleBar() {
  const bar = document.getElementById('role-bar');
  if (!bar) return;
  const n = Object.keys(roleEdits).length;
  if (!n) { bar.innerHTML = ''; return; }
  bar.innerHTML = `<div class="bulk-bar">
    <div class="bulk-head"><span>${n} account${n === 1 ? '' : 's'} changed</span>
      <a id="role-cancel">Cancel</a></div>
    <div class="bulk-row"><button class="go" id="role-save" style="flex:1">Save vault settings</button></div>
  </div>`;
  document.getElementById('role-cancel').onclick = () => { roleEdits = {}; loadFinances(); };
  document.getElementById('role-save').onclick = async () => {
    const btn = document.getElementById('role-save');
    btn.textContent = 'Saving';
    const r = await post({ action:'bulkRoles', roles: roleEdits });
    roleEdits = {};
    if (r.error) { alert(r.error); return; }
    cacheBust();
    loadFinances();
  };
}

// ---- account detail ----
async function openAccount(accountId) {
  const el = document.getElementById('finances-body');
  el.innerHTML = '<div class="empty">Loading</div>';
  const a = await get('getAccountDetail', { accountId: accountId });
  if (a.error) { el.innerHTML = '<div class="empty"><b>Not found</b>' + esc(a.error) + '</div>'; return; }

  const isDebt = a.type === 'credit' || a.type === 'loan';

  // Payoff progress against the original loan amount.
  let payoffBlock = '';
  if (a.original) {
    const pct = a.paidPct || 0;
    payoffBlock = `
      <div class="card">
        <div class="brow-top"><span class="brow-cat">Paid down</span>
          <span class="brow-num"><b>${money(a.paid)}</b> of ${money(a.original)}</span></div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <div class="fcount" style="margin-top:6px">${pct.toFixed(1)}% retired · ${money(a.balance)} remaining</div>
      </div>`;
  } else if (a.type === 'loan') {
    payoffBlock = `<div class="card">
      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">
        Add the original loan amount to track payoff progress.</div>
      <button class="btn ghost" id="set-orig">Set original balance</button></div>`;
  }

  let ratioBlock = '';
  if (a.ratio != null) {
    const pct = Math.min(100, a.ratio * 100);
    const hot = pct > 80;
    ratioBlock = `
      <div class="card">
        <div class="brow-top"><span class="brow-cat">${a.ratioLabel}</span>
          <span class="brow-num"><b>${pct.toFixed(1)}%</b> of ${money(a.ratioBase)}</span></div>
        <div class="track"><div class="fill ${hot ? 'over' : (pct > 60 ? 'warn':'')}" style="width:${pct}%"></div></div>
        ${a.equity != null ? `<div class="fcount" style="margin-top:6px">Equity ${money(a.equity)}</div>` : ''}
      </div>`;
  } else if (a.type === 'loan') {
    ratioBlock = `<div class="card">
      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">
        Add the property or asset value to see loan to value and equity.</div>
      <button class="btn ghost" id="set-ref">Set value</button></div>`;
  }

  // Only what the servicer actually reports. Plaid has no field for the
  // monthly escrow portion, or for PMI, tax and insurance individually.
  let paymentBlock = '';
  if (a.lastPayment != null || a.scheduled != null) {
    const parts = [];
    if (a.scheduled != null) parts.push(['Principal and interest', money(a.scheduled)]);
    if (a.lastPayment != null) parts.push(
      ['Last payment' + (a.lastPaymentDate ? ' · ' + fmtDue(a.lastPaymentDate) : ''), money(a.lastPayment)]);
    if (a.escrowBalance != null) parts.push(['Escrow balance held', money(a.escrowBalance)]);
    paymentBlock = `
      <div class="section-label">Payment</div>
      <div class="card tight">${parts.map(p => `
        <div class="lrow"><div class="nm" style="font-weight:400">${p[0]}</div>
          <div class="vl" style="font-size:14px">${p[1]}</div></div>`).join('')}</div>`;
  }

  const rows = [];
  if (a.available != null && a.type === 'depository') rows.push(['Available', money(a.available)]);
  if (a.limit) rows.push(['Credit limit', money(a.limit)]);
  if (a.limit) rows.push(['Available credit', money(a.limit - a.balance)]);
  if (a.statement != null) rows.push(['Statement balance', money(a.statement)]);
  if (a.scheduled != null && a.type !== 'loan') rows.push(['Scheduled payment', money(a.scheduled)]);
  if (a.due) rows.push(['Next due', fmtDue(a.due)]);
  if (a.apr) rows.push(['APR', a.apr + '%']);
  if (a.lastPayment != null && a.type !== 'loan') rows.push(['Last payment', money(a.lastPayment)]);
  rows.push(['Account', a.plaidName + (a.mask ? ' ••' + a.mask : '')]);



  // Everything else Plaid returns for this liability.
  const detailRows = a.raw ? flattenLiability(a.raw) : [];

  let changeLine = '';
  if (a.change != null && a.changeDays) {
    const down = a.change < 0;
    const good = isDebt ? down : !down;
    changeLine = `<div class="fcount" style="text-align:center;margin-top:6px;color:${
      good ? 'var(--good)' : 'var(--muted)'}">${down ? '−' : '+'}${money(a.change)} over ${a.changeDays} days</div>`;
  }

  el.innerHTML = `
    <span class="back" id="back-fin">← All accounts</span>
    <div class="card">
      <div style="font-size:12.5px;color:var(--muted)">${esc(a.institution)}</div>
      <div style="font-size:22px;font-weight:620;letter-spacing:-.02em;margin:2px 0 10px">${money(a.balance)}</div>
      <div style="font-size:15px;font-weight:500">${esc(a.name)}
        <span class="clear-cat" id="rename-acct">rename</span></div>
      ${a.series.length > 1 ? balanceChart(a.series, isDebt) : ''}
      ${a.series.length > 1 ? changeLine :
        '<div class="fcount" style="text-align:center;margin-top:10px">History starts building from the first refresh.</div>'}
    </div>
    ${paymentBlock}
    ${payoffBlock}
    ${ratioBlock}
    <div class="card tight">${rows.map(r => `
      <div class="lrow"><div class="nm" style="font-weight:400">${r[0]}</div>
        <div class="vl" style="font-size:14px">${r[1]}</div></div>`).join('')}</div>
    ${detailRows.length ? `<div class="section-label">Loan details</div>
      <div class="card tight">${detailRows.map(r => `
        <div class="lrow"><div class="nm" style="font-weight:400">${esc(r[0])}</div>
          <div class="vl" style="font-size:14px;text-align:right">${esc(r[1])}</div></div>`).join('')}</div>`
      : (isDebt ? `<div class="card"><div style="font-size:13px;color:var(--muted)">
          No detail stored yet. Tap Refresh balances on the accounts list to pull it.</div></div>` : '')}`;

  document.getElementById('back-fin').onclick = loadFinances;
  document.getElementById('rename-acct').onclick = async (ev) => {
    ev.stopPropagation();
    const nu = prompt('Rename this account', a.name);
    if (nu === null) return;
    await post({ action:'renameAccount', accountId:a.id, displayName:nu.trim() });
        openAccount(accountId);
  };
  const sr = document.getElementById('set-ref');
  if (sr) sr.onclick = async () => {
    const v = prompt('Estimated property or asset value', a.refValue || '');
    if (v === null) return;
    await post({ action:'setRefValue', accountId:a.id, value: v.replace(/[^0-9.]/g,'') });
    openAccount(accountId);
  };
  const so = document.getElementById('set-orig');
  if (so) so.onclick = async () => {
    const v = prompt('Original loan amount', a.original || '');
    if (v === null) return;
    await post({ action:'setOriginal', accountId:a.id, value: v.replace(/[^0-9.]/g,'') });
    openAccount(accountId);
  };
}

// Turns Plaid's liability object into readable label/value pairs.
function flattenLiability(L) {
  const MONEY = ['origination_principal_amount','escrow_balance','current_late_fee','past_due_amount',
    'ytd_interest_paid','ytd_principal_paid','next_monthly_payment','last_payment_amount',
    'minimum_payment_amount','last_statement_balance','outstanding_interest_amount',
    'expected_payoff_amount','original_principal_amount'];
  const DATES = ['origination_date','maturity_date','next_payment_due_date','last_payment_date',
    'last_statement_issue_date','expected_payoff_date','loan_end_date'];
  const LABELS = {
    origination_principal_amount:'Original amount', origination_date:'Originated',
    maturity_date:'Matures', loan_term:'Term', loan_type_description:'Loan type',
    escrow_balance:'Escrow balance', has_pmi:'PMI', has_prepayment_penalty:'Prepayment penalty',
    ytd_interest_paid:'Interest paid YTD', ytd_principal_paid:'Principal paid YTD',
    current_late_fee:'Late fee', past_due_amount:'Past due',
    next_monthly_payment:'Monthly payment', next_payment_due_date:'Next due',
    last_payment_amount:'Last payment', last_payment_date:'Last paid',
    interest_rate:'Interest rate', property_address:'Property',
    account_number:'Account number', is_overdue:'Overdue',
    outstanding_interest_amount:'Accrued interest', expected_payoff_amount:'Payoff amount',
    expected_payoff_date:'Payoff date', repayment_plan:'Repayment plan',
    loan_status:'Status', guarantor:'Guarantor', servicer_address:'Servicer',
    disbursement_dates:'Disbursed', pslf_status:'PSLF', sequence_number:'Sequence',
    last_statement_balance:'Statement balance', last_statement_issue_date:'Statement date',
    minimum_payment_amount:'Minimum payment', aprs:'APRs'
  };
  const SKIP = { account_id:1, aprs:1, account_number:1 };

  const fmtMoney = v => '$' + Number(v).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  const out = [];

  Object.keys(L).forEach(k => {
    if (SKIP[k]) return;
    let v = L[k];
    if (v === null || v === undefined || v === '') return;

    if (k === 'interest_rate' && typeof v === 'object') {
      if (v.percentage != null) out.push(['Interest rate', v.percentage + '%' + (v.type ? ' (' + String(v.type).replace(/_/g,' ') + ')' : '')]);
      return;
    }
    if (k === 'repayment_plan' && typeof v === 'object') {
      out.push(['Repayment plan', v.description || v.type || '']); return;
    }
    if (k === 'loan_status' && typeof v === 'object') {
      out.push(['Status', String(v.type || '').replace(/_/g,' ')]); return;
    }
    if (k === 'property_address' && typeof v === 'object') {
      const p = [v.street, v.city, v.region, v.postal_code].filter(Boolean).join(', ');
      if (p) out.push(['Property', p]);
      return;
    }
    if (typeof v === 'object') return;   // anything else nested, skip

    const label = LABELS[k] || k.replace(/_/g,' ').replace(/^./, s => s.toUpperCase());
    if (typeof v === 'boolean') v = v ? 'Yes' : 'No';
    else if (MONEY.indexOf(k) !== -1) v = fmtMoney(v);
    else if (DATES.indexOf(k) !== -1) v = String(v).slice(0,10);
    else if (k === 'loan_term') v = String(v).replace(/_/g,' ');
    out.push([label, String(v)]);
  });

  return out;
}

function balanceChart(series, isDebt) {
  const W = 320, H = 110, pad = 8;
  const vals = series.map(s => s.balance);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || Math.max(max * 0.02, 1);
  const x = i => pad + (i / Math.max(series.length - 1, 1)) * (W - pad * 2);
  const y = v => H - 18 - ((v - min + span * 0.1) / (span * 1.2)) * (H - 30);

  const pts = series.map((s, i) => x(i) + ',' + y(s.balance)).join(' ');
  const area = `${pad},${H-18} ${pts} ${x(series.length-1)},${H-18}`;
  const down = vals[vals.length-1] < vals[0];
  const color = isDebt ? (down ? '#5D9078' : '#B8676C') : (down ? '#B8676C' : '#5D9078');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin-top:12px">
    <polygon points="${area}" fill="${color}" opacity=".08"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(series.length-1)}" cy="${y(vals[vals.length-1])}" r="3.5" fill="${color}"/>
    <text x="${pad}" y="${H-4}" font-size="9.5" fill="#9BA0A6">${series[0].date.slice(5)}</text>
    <text x="${W-pad}" y="${H-4}" text-anchor="end" font-size="9.5" fill="#9BA0A6">${series[series.length-1].date.slice(5)}</text>
  </svg>`;
}

async function doRefreshFinances() {
  const b = document.getElementById('fin-refresh');
  b.textContent = 'Refreshing'; b.disabled = true;
  const r = await post({ action:'refreshFinances' });
  if (r.errors && r.errors.length) alert('Trouble with:\n' + r.errors.join('\n'));
  loadFinances();
}

function fmtDue(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function fmtWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ' ' +
         d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}

// ============ ACCOUNTS ============
async function loadAccounts() {
  const el = document.getElementById('accounts-body');
  if (!cacheGet('accounts')) el.innerHTML = '<div class="empty">Loading</div>';
  await cachedLoad('accounts', () => get('accountsBundle'), renderAccounts);
}

function renderAccounts(d) {
  const el = document.getElementById('accounts-body');
  const accounts = d.accounts, rules = d.rules, institutions = d.institutions;

  const consentOf = {};
  (institutions || []).forEach(i => consentOf[i.name] = i.consented);

  const reauthCell = (name) => consentOf[name]
    ? `<span class="reauth" data-i="${esc(name)}" data-mode="accounts"
        style="font-size:12px;color:var(--accent);cursor:pointer;flex:none">Add accounts</span>`
    : `<span class="reauth" data-i="${esc(name)}"
        style="font-size:12px;color:var(--accent);cursor:pointer;flex:none">Re-authorize</span>`;

  const list = (accounts && accounts.length)
    ? accounts.map(a => `<div class="lrow">
        <div style="min-width:0;flex:1"><div class="nm">${esc(a.institution)}</div>
        <div class="sb">${a.cards.length} account${a.cards.length === 1 ? '' : 's'}</div></div>
        ${reauthCell(a.institution)}
        </div>`).join('')
    : '<div class="empty" style="padding:22px">No accounts connected yet.</div>';

  const missing = (institutions || [])
    .filter(i => !(accounts || []).some(a => a.institution === i.name));
  const missingList = missing.map(i => `<div class="lrow">
      <div class="nm" style="flex:1">${esc(i.name)}</div>${reauthCell(i.name)}</div>`).join('');

  const ruleList = (rules && rules.length)
    ? rules.map(r => `<div class="lrow">
        <div style="min-width:0;flex:1"><div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.example)}</div>
        <div class="sb">suggested ${r.total} time${r.total === 1 ? '' : 's'}</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="rule-cat">${esc(r.category)}</span>
          <span class="rm" data-m="${esc(r.match)}" style="color:var(--faint);cursor:pointer;font-size:17px">×</span>
        </div></div>`).join('')
    : '<div class="empty" style="padding:22px">No rules yet.</div>';

  el.innerHTML = `
    <div class="section-label">Connections</div>
    <div class="card tight">${list}${missingList}</div>
    <div class="card">
      <button class="btn" id="connect">Connect a bank or card</button>
      <button class="btn ghost" id="connect-loan" style="margin-top:8px">Connect a loan or mortgage</button>
    </div>

    <div class="section-label">Merchant memory</div>
    <div class="card tight">${ruleList}</div>`;

  document.getElementById('connect').onclick = () => connectAccount('bank');
  document.getElementById('connect-loan').onclick = () => connectAccount('loan');
  el.querySelectorAll('.rm').forEach(x => x.onclick = async () => {
    if (!confirm('Forget this merchant rule?')) return;
    await post({ action:'deleteRule', payee:x.dataset.m });
    loadAccounts();
  });
  el.querySelectorAll('.reauth').forEach(x => x.onclick = () => reauth(x.dataset.i, x, x.dataset.mode === 'accounts'));
}

// Update mode: same Item, same token, just broader consent.
// Update mode. Same Item, same token, no new connection slot. Used both to
// grant extra product consent and to share accounts opened after linking.
async function reauth(institution, el, accountsOnly) {
  const label = el.textContent;
  el.textContent = 'Opening';
  const r = await post({ action:'updateLinkToken', institution: institution, accountsOnly: !!accountsOnly });
  if (!r.link_token) { alert(r.error || 'Could not start.'); el.textContent = label; return; }
  Plaid.create({
    token: r.link_token,
    onSuccess: async () => {
      el.textContent = 'Updating';
      if (!accountsOnly) await post({ action:'markReauthed', institution: institution, products: r.products });
      await post({ action:'forceSync' });
      await post({ action:'refreshFinances' });
      cacheBust();
      loadAccounts();
    },
    onExit: () => { el.textContent = label; }
  }).open();
}

async function connectAccount(kind) {
  const r = await post({ action:'createLinkToken', kind: kind || 'bank' });
  if (!r.link_token) { alert(r.error || 'Could not start Plaid.'); return; }
  Plaid.create({ token:r.link_token, onSuccess: async (pt) => {
    const name = prompt('Name this institution (e.g. PennyMac, Chase):');
    if (!name) return;
    const res = await post({ action:'connectAccount', publicToken:pt, accountName:name, products:r.products });
    if (res.error) { alert(res.error); return; }
    await post({ action:'forceSync' });
    await post({ action:'refreshFinances' });
    cacheBust();
    loadAccounts();
  }}).open();
}

function fmtDate(d) {
  return new Date(String(d).slice(0,10) + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

loadCategorize();
