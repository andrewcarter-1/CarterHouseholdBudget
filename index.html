<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carter Budget</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root {
    --bg:#F4F3F0; --surface:#FFFFFF; --surface-2:#FAF9F7; --border:#E4E1DB;
    --text:#23262A; --muted:#767B82; --faint:#9BA0A6;
    --accent:#45688E; --accent-bg:#ECF1F6;
    --good:#5D9078; --good-bg:#EDF3F0; --warn:#C79553;
    --over:#B8676C; --over-bg:#F7EDED; --r:12px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; -webkit-font-smoothing:antialiased; }
  #app { max-width:500px; margin:0 auto; min-height:100vh; padding-bottom:76px; }

  header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 18px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; }
  header .sub { font-size:13.5px; color:var(--muted); font-weight:500; }
  .sync-btn { border:1px solid var(--border); background:var(--surface-2); color:var(--accent);
    font-size:13px; font-weight:500; padding:7px 12px; border-radius:8px; cursor:pointer; font-family:inherit; }
  .sync-btn:active { background:var(--accent-bg); }
  .sync-btn[disabled] { color:var(--faint); }

  .view { display:none; padding:12px 14px 4px; }
  .view.active { display:block; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px; margin-bottom:10px; }
  .card.tight { padding:10px 14px; }
  .section-label { font-size:12.5px; color:var(--muted); margin:14px 2px 7px; font-weight:500;
    display:flex; justify-content:space-between; align-items:center; }
  .section-label a { color:var(--accent); cursor:pointer; font-weight:500; }

  /* month picker */
  .months { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; }
  .months::-webkit-scrollbar { display:none; }
  .mpill { flex:none; font-size:12.5px; padding:6px 12px; border-radius:8px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface); color:var(--muted); white-space:nowrap; }
  .mpill.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500; }

  /* categorize */
  .txn-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .txn-payee { font-size:15px; font-weight:550; letter-spacing:-.005em; }
  .txn-meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .txn-amt { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .txn-amt.in { color:var(--good); }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:11px; }
  .chip { font-size:12.5px; padding:5px 10px; border-radius:7px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text); }
  .chip.excl { color:var(--muted); font-style:italic; }
  .chip.save { background:var(--good-bg); border-color:#D3E2DA; color:#3F6B57; }
  .chip:active,.chip.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.sug { border-color:var(--accent); border-style:dashed; color:var(--accent); background:var(--accent-bg); }
  .chip-div { flex-basis:100%; font-size:11px; color:var(--faint); margin:6px 0 1px; }

  /* rows */
  .brow { padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .brow:last-child { border-bottom:none; }
  .brow-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:8px; }
  .brow-cat { font-size:14px; font-weight:500; }
  .brow-num { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .brow-num b { color:var(--text); font-weight:600; }
  .track { height:5px; background:#EDEBE7; border-radius:3px; overflow:hidden; }
  .fill { height:100%; border-radius:3px; background:var(--good); transition:width .3s ease; }
  .fill.warn { background:var(--warn); }
  .fill.over { background:var(--over); }

  .totals { display:flex; gap:10px; }
  .totals > div { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px 13px; }
  .totals .lbl { font-size:11.5px; color:var(--muted); }
  .totals .val { font-size:20px; font-weight:620; font-variant-numeric:tabular-nums; margin-top:2px; letter-spacing:-.02em; }

  .lrow { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); }
  .lrow:last-child { border-bottom:none; }
  .lrow .nm { font-size:14px; font-weight:500; }
  .lrow .sb { font-size:11.5px; color:var(--faint); }
  .lrow .vl { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }

  .note { font-size:12.5px; line-height:1.5; color:var(--muted); background:var(--accent-bg);
    border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .note.flag { background:var(--over-bg); color:#8C4A4E; }
  .empty { text-align:center; padding:48px 20px; color:var(--muted); font-size:13.5px; }
  .empty b { display:block; color:var(--text); font-size:15px; margin-bottom:3px; font-weight:550; }

  .btn { display:block; width:100%; padding:12px; border-radius:9px; border:none; background:var(--accent);
    color:#fff; font-size:14.5px; font-weight:500; cursor:pointer; font-family:inherit; }
  .btn:active { background:#3A587A; }
  .btn.ghost { background:var(--surface-2); color:var(--accent); border:1px solid var(--border); }
  input,select { width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:8px;
    font-size:14.5px; margin-bottom:8px; font-family:inherit; background:var(--surface-2); color:var(--text); }
  label { font-size:12.5px; color:var(--muted); display:block; margin-bottom:3px; }

  nav { position:fixed; bottom:0; left:0; right:0; max-width:500px; margin:0 auto;
    background:rgba(255,255,255,.94); backdrop-filter:blur(12px); border-top:1px solid var(--border);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20; }
  nav button { flex:1; padding:11px 0 10px; background:none; border:none; font-size:11.5px;
    color:var(--muted); cursor:pointer; font-family:inherit; }
  nav button.active { color:var(--accent); font-weight:600; }
  nav .dot { display:block; font-size:16px; line-height:1.1; margin-bottom:1px; }
  .back { font-size:13px; color:var(--accent); cursor:pointer; margin-bottom:10px; display:inline-block; }

  /* split panel */
  .split-link { font-size:12px; color:var(--accent); cursor:pointer; margin-top:9px; display:inline-block; }
  .split-box { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
  .split-line { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .split-line select { flex:1; margin:0; font-size:13px; padding:8px 9px; }
  .split-line input { width:88px; margin:0; font-size:13px; padding:8px 9px; text-align:right; }
  .split-line .rm { color:var(--faint); cursor:pointer; font-size:17px; padding:0 3px; flex:none; }
  .split-foot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; }
  .split-tally { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .split-tally.bad { color:var(--over); }
  .split-foot button { font-size:12.5px; padding:7px 12px; border-radius:7px; cursor:pointer; font-family:inherit; border:1px solid var(--border); }
  .split-foot .add { background:var(--surface-2); color:var(--accent); }
  .split-foot .go { background:var(--accent); color:#fff; border-color:var(--accent); }
  .rule-cat { font-size:12.5px; color:var(--accent); background:var(--accent-bg); padding:3px 8px; border-radius:6px; }

  /* filter bar */
  .filters { background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    padding:10px; margin-bottom:10px; }
  .seg { display:flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .seg button { flex:1; padding:7px 0; background:var(--surface-2); border:none; font-size:12.5px;
    color:var(--muted); cursor:pointer; font-family:inherit; border-right:1px solid var(--border); }
  .seg button:last-child { border-right:none; }
  .seg button.on { background:var(--accent); color:#fff; font-weight:500; }
  .frow { display:flex; gap:6px; }
  .frow select, .frow input { margin:0; font-size:12.5px; padding:7px 8px; }
  .fcount { font-size:11.5px; color:var(--faint); margin-top:7px; }

  .cat-badge { font-size:12px; color:var(--accent); background:var(--accent-bg);
    padding:3px 9px; border-radius:6px; cursor:pointer; display:inline-block; margin-top:9px; }
  .cat-badge.excl { color:var(--muted); background:#F0EFEC; font-style:italic; }

  .save-row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; }
  .save-pick { font-size:12.5px; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .save-pick b { color:var(--text); font-weight:600; }
  .save-btn { flex:none; font-size:13px; font-weight:500; padding:8px 16px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--faint);
    cursor:not-allowed; font-family:inherit; }
  .save-btn.ready { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; }

  /* sparkline grid */
  .spark-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .spark-row:last-child { border-bottom:none; }
  .spark-name { flex:1; min-width:0; }
  .spark-name .n { font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spark-name .d { font-size:11px; color:var(--faint); }
  .spark-name .d.bad { color:var(--over); }
  svg text { font-family:inherit; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="sub" id="subtitle">Loading</div>
    <button class="sync-btn" id="sync-btn">Sync</button>
  </header>
  <section class="view active" id="view-categorize">
    <div class="filters">
      <div class="seg" id="seg-status">
        <button class="on" data-s="todo">Needs category</button>
        <button data-s="done">Categorized</button>
        <button data-s="all">All</button>
      </div>
      <div class="frow">
        <select id="f-account"><option value="all">All accounts</option></select>
        <select id="f-sort">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="largest">Largest</option>
          <option value="smallest">Smallest</option>
        </select>
      </div>
      <div class="frow" style="margin-top:6px">
        <select id="f-month"><option value="all">All months</option></select>
        <input type="text" id="f-search" placeholder="Search payee">
      </div>
      <div class="fcount" id="f-count"></div>
    </div>
    <div id="txn-list"></div>
  </section>
  <section class="view" id="view-budget"><div id="budget-body"></div></section>
  <section class="view" id="view-trends"><div id="trends-body"></div></section>
  <section class="view" id="view-accounts"><div id="accounts-body"></div></section>
</div>
<nav>
  <button class="active" data-v="categorize"><span class="dot">◎</span>Categorize</button>
  <button data-v="budget"><span class="dot">▤</span>Budget</button>
  <button data-v="trends"><span class="dot">◪</span>Compare</button>
  <button data-v="accounts"><span class="dot">⬡</span>Accounts</button>
</nav>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxcRTPMFiNWlMFH_Fr0z-Ys3fG7KQwR-J6-QHotqbILfrZWIl5qCA1IRoUtsA7fC5U/exec';

let cats = [], txns = [], months = [], trendCache = null;
const now = new Date();
let selMonth = now.toLocaleString('en-US', { month: 'long' });
let selYear  = now.getFullYear();

const money = n => '$' + Math.round(Math.abs(n)).toLocaleString();
const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function get(action, params = {}) {
  const u = new URL(API); u.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
  return (await fetch(u)).json();
}
async function post(body) { return (await fetch(API,{method:'POST',body:JSON.stringify(body)})).json(); }

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('view-' + b.dataset.v).classList.add('active');
  window.scrollTo(0,0);
  if (b.dataset.v === 'budget') loadBudget();
  if (b.dataset.v === 'trends') loadCompare();
  if (b.dataset.v === 'accounts') loadAccounts();
});

document.getElementById('sync-btn').onclick = async () => {
  const btn = document.getElementById('sync-btn');
  btn.disabled = true; btn.textContent = 'Syncing';
  const r = await post({ action:'forceSync' });
  btn.disabled = false; btn.textContent = 'Sync';
  trendCache = null; filtersLoaded = false;
  if (r.error) { alert(r.error); return; }
  if (r.errors && r.errors.length) alert('Trouble with:\n' + r.errors.join('\n'));
  else if (r.auto > 0) {
    document.getElementById('subtitle').textContent = r.auto + ' auto-categorized';
    setTimeout(() => loadCategorize(), 1400);
    return;
  }
  await loadCategorize();
};

// ============ CATEGORIZE ============
const filters = { status:'todo', account:'all', month:'all', sort:'newest', search:'' };
let totalMatching = 0;

async function loadCategorize() {
  if (!cats.length) cats = await get('getCategories');
  const res = await get('getTransactions', filters);
  txns = res.rows || [];
  totalMatching = res.total || 0;
  renderTxns();
  loadFilterOptions();
}

let filtersLoaded = false;
async function loadFilterOptions() {
  if (filtersLoaded) return;
  const o = await get('getFilterOptions');
  const acc = document.getElementById('f-account');
  (o.accounts || []).forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a.replace(/ · $/, '');
    acc.appendChild(opt);
  });
  const mon = document.getElementById('f-month');
  (o.months || []).forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    mon.appendChild(opt);
  });
  filtersLoaded = true;
}

document.querySelectorAll('#seg-status button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#seg-status button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); filters.status = b.dataset.s; loadCategorize();
});
['f-account','f-sort','f-month'].forEach(id =>
  document.getElementById(id).onchange = e => {
    filters[id.replace('f-','') === 'account' ? 'account' : id.replace('f-','')] = e.target.value;
    loadCategorize();
  });
let searchTimer;
document.getElementById('f-search').oninput = e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filters.search = e.target.value.trim(); loadCategorize(); }, 350);
};

function renderTxns() {
  const el = document.getElementById('txn-list');
  const todo = filters.status === 'todo';
  document.getElementById('subtitle').textContent =
    todo ? (totalMatching ? totalMatching + ' to categorize' : 'All caught up') : totalMatching + ' transactions';
  document.getElementById('f-count').textContent =
    totalMatching > txns.length ? 'Showing ' + txns.length + ' of ' + totalMatching : '';

  if (!txns.length) {
    el.innerHTML = todo
      ? '<div class="empty"><b>Nothing to categorize</b>Tap Sync to pull anything new.</div>'
      : '<div class="empty"><b>No matches</b>Try widening the filters.</div>';
    return;
  }

  // Grouped by type so the colors read as sections. Within each group,
  // most-used first so common picks stay near the top.
  const byUse = (a,b) => (b.used||0) - (a.used||0);
  const expense  = cats.filter(c => c.type === 'Expense').sort(byUse);
  const savings  = cats.filter(c => c.type === 'Savings').sort(byUse);
  const excluded = cats.filter(c => c.type === 'Excluded').sort(byUse);
  const ordered = [...expense, ...savings, ...excluded];

  const chipFor = (c, cls) => `<div class="chip ${cls}" data-c="${esc(c.name)}">${esc(c.name)}</div>`;
  let chipsHtml = expense.map(c => chipFor(c, '')).join('');
  if (savings.length)  chipsHtml += `<div class="chip-div">Savings envelopes</div>` + savings.map(c => chipFor(c, 'save')).join('');
  if (excluded.length) chipsHtml += `<div class="chip-div">Not budgeted</div>` + excluded.map(c => chipFor(c, 'excl')).join('');

  const optsHtml = ordered.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  const typeOf = {}; cats.forEach(c => typeOf[c.name] = c.type);

  el.innerHTML = txns.map(t => {
    const done = !!t.category;
    const sug = !done && t.suggested ? t.suggested : '';
    return `
    <div class="card" data-id="${esc(t.transactionId)}" data-amt="${Math.abs(t.amount)}" data-done="${done}"
         ${sug ? `data-pick="${esc(sug)}"` : ''}>
      <div class="txn-head">
        <div><div class="txn-payee">${esc(t.payee)}</div>
        <div class="txn-meta">${fmtDate(t.date)} · ${esc(t.institution)}${t.card ? ' · ' + esc(t.card) : ''}</div></div>
        <div class="txn-amt ${t.amount > 0 ? 'in':''}">${t.amount > 0 ? '+':''}${money(t.amount)}</div>
      </div>
      ${done
        ? `<span class="cat-badge ${typeOf[t.category] === 'Excluded' ? 'excl':''}">${esc(t.category)}</span>`
        : ''}
      <div class="chips" style="${done ? 'display:none' : ''}">${
        sug ? chipsHtml.replace(`data-c="${esc(sug)}"`, `data-c="${esc(sug)}" class-hook="sug"`) : chipsHtml
      }</div>
      <div class="save-row" style="${done ? 'display:none' : ''}">
        <span class="split-link" style="margin-top:0">Split</span>
        <span class="save-pick">${sug
          ? 'Suggested <b>' + esc(sug) + '</b>' + (t.suggestSeen > 1 ? ' · seen ' + t.suggestSeen + '×' : '')
          : 'Pick a category'}</span>
        <button class="save-btn ${sug ? 'ready':''}">Save</button>
      </div>
      <div class="split-box" style="display:none" data-opts='${optsHtml.replace(/'/g, "&#39;")}'></div>
    </div>`;
  }).join('');

  // highlight any pre-selected suggestion
  el.querySelectorAll('.card').forEach(card => {
    const pick = card.dataset.pick;
    if (!pick) return;
    const chip = [...card.querySelectorAll('.chip')].find(c => c.dataset.c === pick);
    if (chip) chip.classList.add('sug');
  });

  // tapping the badge on a categorized row opens the chips to change it
  el.querySelectorAll('.cat-badge').forEach(badge => badge.onclick = () => {
    const card = badge.closest('.card');
    card.querySelector('.chips').style.display = '';
    card.querySelector('.save-row').style.display = '';
    badge.style.display = 'none';
  });

  // selecting a chip only stages the choice; nothing saves until Save is tapped
  el.querySelectorAll('.chip').forEach(chip => chip.onclick = () => {
    const card = chip.closest('.card');
    card.querySelectorAll('.chip').forEach(c => c.classList.remove('sel','sug'));
    chip.classList.add('sel');
    card.dataset.pick = chip.dataset.c;
    card.querySelector('.save-pick').innerHTML = '<b>' + esc(chip.dataset.c) + '</b>';
    card.querySelector('.save-btn').classList.add('ready');
  });

  el.querySelectorAll('.save-btn').forEach(btn => btn.onclick = async () => {
    const card = btn.closest('.card');
    const pick = card.dataset.pick;
    if (!pick) return;
    btn.textContent = 'Saving'; btn.classList.remove('ready');
    const id = card.dataset.id;
    await post({ action:'saveCategory', transactionId:id, category:pick });
    trendCache = null;
    card.style.opacity = '.35';
    setTimeout(() => {
      if (filters.status === 'todo') { txns = txns.filter(t => t.transactionId !== id); totalMatching--; renderTxns(); }
      else loadCategorize();
    }, 220);
  });

  el.querySelectorAll('.split-link').forEach(link => link.onclick = () => {
    const card = link.closest('.card');
    const box = card.querySelector('.split-box');
    if (box.style.display === 'none') { openSplit(card, box); link.textContent = 'Cancel'; }
    else {
      box.style.display = 'none'; box.innerHTML = '';
      card.querySelector('.chips').style.display = '';
      card.querySelector('.save-pick').style.display = '';
      card.querySelector('.save-btn').style.display = '';
      link.textContent = 'Split';
    }
  });
}

function openSplit(card, box) {
  card.querySelector('.chips').style.display = 'none';
  card.querySelector('.save-pick').style.display = 'none';
  card.querySelector('.save-btn').style.display = 'none';
  box.style.display = 'block';
  const total = Number(card.dataset.amt);
  const opts = box.dataset.opts;

  box.innerHTML = `
    <div class="split-rows"></div>
    <div class="split-foot">
      <span class="split-tally"></span>
      <span style="display:flex;gap:6px">
        <button class="add">Add part</button>
        <button class="go">Save split</button>
      </span>
    </div>`;

  const rowsEl = box.querySelector('.split-rows');
  const addLine = (amt) => {
    const div = document.createElement('div');
    div.className = 'split-line';
    div.innerHTML = `<select>${opts}</select>
      <input type="number" step="0.01" placeholder="0.00" value="${amt != null ? amt : ''}">
      <span class="rm">×</span>`;
    div.querySelector('.rm').onclick = () => { div.remove(); tally(); };
    div.querySelector('input').oninput = tally;
    rowsEl.appendChild(div);
    tally();
  };

  function tally() {
    const vals = [...rowsEl.querySelectorAll('input')].map(i => Number(i.value) || 0);
    const sum = vals.reduce((a,b) => a + b, 0);
    const diff = total - sum;
    const t = box.querySelector('.split-tally');
    t.textContent = Math.abs(diff) < 0.01
      ? '$' + total.toFixed(2) + ' allocated'
      : '$' + Math.abs(diff).toFixed(2) + (diff > 0 ? ' left' : ' over');
    t.className = 'split-tally' + (Math.abs(diff) < 0.01 ? '' : ' bad');
  }

  addLine((total / 2).toFixed(2));
  addLine((total / 2).toFixed(2));
  box.querySelector('.add').onclick = () => addLine();

  box.querySelector('.go').onclick = async () => {
    const splits = [...rowsEl.querySelectorAll('.split-line')].map(l => ({
      category: l.querySelector('select').value,
      amount: Number(l.querySelector('input').value) || 0
    })).filter(s => s.amount > 0);
    if (splits.length < 2) { alert('A split needs at least two parts with amounts.'); return; }
    const id = card.dataset.id;
    const r = await post({ action:'splitTransaction', transactionId:id, splits:splits });
    if (r.error) { alert(r.error); return; }
    trendCache = null;
    card.style.opacity = '.35';
    setTimeout(() => { txns = txns.filter(t => t.transactionId !== id); renderTxns(); }, 220);
  };
}

// ============ BUDGET (month picker) ============
async function loadBudget() {
  const el = document.getElementById('budget-body');
  el.innerHTML = '<div class="empty">Loading</div>';
  if (!months.length) months = await get('getAvailableMonths');
  // Current month may not have a tab yet; the backend creates it on request.
  if (!months.some(m => m.month === selMonth && m.year === selYear)) {
    months = [{ month: selMonth, year: selYear, label: selMonth + ' ' + selYear }, ...months];
  }
  const budget = await get('getBudgetSummary', { month:selMonth, year:selYear });
  const vaults = await get('getVaults');
  const accts  = await get('getSpendByAccount', { month:selMonth, year:selYear });

  const picker = `<div class="months">` + (months.length ? months.map(m =>
    `<div class="mpill ${m.month===selMonth && m.year===selYear ? 'on':''}"
      data-m="${m.month}" data-y="${m.year}">${m.month.slice(0,3)} ${String(m.year).slice(2)}</div>`
  ).join('') : '') + `</div>`;

  if (budget.error) {
    el.innerHTML = picker + `<div class="empty"><b>No budget for ${selMonth} ${selYear}</b>Run setupCurrentMonth() in Apps Script.</div>`;
    bindPicker(); return;
  }

  const expenses = budget.filter(b => b.type === 'Expense');
  const savings  = budget.filter(b => b.type === 'Savings');
  const tBud = budget.reduce((s,b) => s + b.budgeted, 0);
  const tSpent = budget.reduce((s,b) => s + b.spent, 0);
  const left = tBud - tSpent;

  let html = picker + `
    <div class="totals">
      <div><div class="lbl">Spent</div><div class="val">${money(tSpent)}</div></div>
      <div><div class="lbl">${left < 0 ? 'Over by':'Left'}</div>
        <div class="val" style="color:${left < 0 ? 'var(--over)':'var(--good)'}">${money(left)}</div></div>
    </div>
    <div class="card">${donut(expenses)}</div>
    <div class="section-label">Spending</div>
    <div class="card tight">${expenses.map(row).join('')}</div>`;

  if (savings.length) html += `<div class="section-label">Savings contributions</div>
    <div class="card tight">${savings.map(row).join('')}</div>`;

  if (vaults && vaults.length) html += `<div class="section-label">Envelope balances</div>
    <div class="card tight">` + vaults.map(v => `
      <div class="lrow"><div><div class="nm">${esc(v.name)}</div>
        <div class="sb">${money(v.contributed)} in · ${money(v.spent)} spent</div></div>
        <div class="vl" style="color:var(--good)">${money(v.balance)}</div></div>`).join('') + `</div>
    <div class="note">Money moved into an envelope counts against the budget that month. Spending it later does not, so a trip paid from savings will not blow up that month.</div>`;

  if (accts && accts.length) html += `<div class="section-label">By card</div>
    <div class="card tight">` + accts.map(a => `
      <div class="lrow"><div><div class="nm">${esc(a.card)}</div>
        <div class="sb">${esc(a.institution)}</div></div>
        <div class="vl">${money(a.spent)}</div></div>`).join('') + `</div>`;

  html += `<div class="section-label">Add a category</div>
    <div class="card">
      <label>Name</label><input type="text" id="c-name" placeholder="Subscriptions">
      <label>Monthly amount</label><input type="number" id="c-amt" placeholder="0">
      <label>Type</label>
      <select id="c-type">
        <option value="Expense">Expense — counts against budget</option>
        <option value="Savings">Savings — builds an envelope</option>
        <option value="Excluded">Excluded — ignore (transfers, CC payments)</option>
      </select>
      <button class="btn ghost" id="c-add">Add category</button>
    </div>`;

  el.innerHTML = html;
  bindPicker();
  el.querySelectorAll('.brow').forEach(r => r.onclick = () => openTrend(r.dataset.cat));
  document.getElementById('c-add').onclick = addCategory;
}

function bindPicker() {
  document.querySelectorAll('#view-budget .mpill').forEach(p => p.onclick = () => {
    selMonth = p.dataset.m; selYear = Number(p.dataset.y); loadBudget();
  });
}

function row(b) {
  const pct = b.budgeted > 0 ? Math.min(100, (b.spent / b.budgeted) * 100) : 0;
  const cls = b.budgeted > 0 && b.spent > b.budgeted ? 'over' : (pct > 85 ? 'warn' : '');
  return `<div class="brow" data-cat="${esc(b.category)}">
    <div class="brow-top"><span class="brow-cat">${esc(b.category)}</span>
      <span class="brow-num"><b>${money(b.spent)}</b> / ${money(b.budgeted)}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
}

function donut(rows) {
  const data = rows.filter(r => r.spent > 0).sort((a,b) => b.spent - a.spent).slice(0,6);
  const total = data.reduce((s,d) => s + d.spent, 0);
  if (!total) return '<div class="empty" style="padding:20px">Nothing spent yet.</div>';
  const shades = ['#45688E','#5D9078','#C79553','#8A7CA8','#7E9EB8','#B8676C'];
  const R = 52, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = data.map((d,i) => {
    const len = (d.spent / total) * C;
    const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${shades[i%6]}" stroke-width="17"
      stroke-dasharray="${len-1.5} ${C-len+1.5}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off += len; return s;
  }).join('');
  const legend = data.map((d,i) => `
    <div style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:5px">
      <span style="width:9px;height:9px;border-radius:2px;background:${shades[i%6]};flex:none"></span>
      <span style="flex:1">${esc(d.category)}</span>
      <span style="color:var(--muted);font-variant-numeric:tabular-nums">${money(d.spent)}</span></div>`).join('');
  return `<div style="display:flex;gap:14px;align-items:center">
    <svg width="140" height="140" viewBox="0 0 140 140" style="flex:none">${arcs}
      <text x="70" y="66" text-anchor="middle" font-size="17" font-weight="600" fill="#23262A">${money(total)}</text>
      <text x="70" y="82" text-anchor="middle" font-size="10.5" fill="#767B82">spent</text></svg>
    <div style="flex:1">${legend}</div></div>`;
}

async function addCategory() {
  const name = document.getElementById('c-name').value.trim();
  const amt = Number(document.getElementById('c-amt').value) || 0;
  const type = document.getElementById('c-type').value;
  if (!name) { alert('Give the category a name.'); return; }
  if (type !== 'Excluded' && !amt) { alert('Give it a monthly amount.'); return; }
  const r = await post({ action:'addCategory', category:name, defaultAmount:amt, type:type });
  if (r.error) { alert(r.error); return; }
  cats = await get('getCategories'); trendCache = null; loadBudget();
}

// ============ COMPARE (all months, all categories) ============
async function loadCompare() {
  const el = document.getElementById('trends-body');
  el.innerHTML = '<div class="empty">Loading</div>';
  if (!trendCache) trendCache = await get('getAllTrends', { months: 6 });
  const t = trendCache;
  if (t.error) { el.innerHTML = '<div class="empty"><b>No data yet</b>' + esc(t.error) + '</div>'; return; }

  const anySpend = t.totals.some(x => x.spent > 0);
  if (!anySpend) { el.innerHTML = '<div class="empty"><b>Nothing to compare yet</b>Categorize a few transactions first.</div>'; return; }

  // household totals over time
  let html = `<div class="section-label">Household, last ${t.months.length} months</div>
    <div class="card">${totalsChart(t)}</div>`;

  // flag categories trending over
  const flagged = t.categories.filter(c => {
    const withB = c.data.filter(d => d.budgeted != null && d.budgeted > 0);
    if (withB.length < 3) return false;
    return withB.filter(d => d.spent > d.budgeted).length >= Math.ceil(withB.length * 0.6);
  });
  if (flagged.length) {
    html += `<div class="note flag"><b>Running over consistently:</b> ${flagged.map(f => esc(f.name)).join(', ')}.
      Either these budgets are too low or they are the ones to pull back on.</div>`;
  }

  html += `<div class="section-label">Every category<span>tap to drill in</span></div><div class="card tight">`;
  html += t.categories
    .map(c => ({ c, tot: c.data.reduce((s,d) => s + d.spent, 0) }))
    .sort((a,b) => b.tot - a.tot)
    .map(({ c }) => {
      const last = c.data[c.data.length - 1];
      const active = c.data.filter(d => d.spent > 0);
      const avg = active.length ? active.reduce((s,d) => s + d.spent, 0) / active.length : 0;
      const over = last.budgeted && last.spent > last.budgeted;
      return `<div class="spark-row" data-cat="${esc(c.name)}">
        <div class="spark-name"><div class="n">${esc(c.name)}</div>
          <div class="d ${over ? 'bad':''}">${money(last.spent)} this month · ${money(avg)} avg</div></div>
        ${sparkline(c.data)}
      </div>`;
    }).join('');
  html += `</div>`;

  el.innerHTML = html;
  el.querySelectorAll('.spark-row').forEach(r => r.onclick = () => openTrend(r.dataset.cat));
}

function totalsChart(t) {
  const W = 320, H = 150, pad = 24;
  const max = Math.max(...t.totals.map(x => Math.max(x.spent, x.budgeted)), 1);
  const bw = (W - pad * 2) / t.totals.length;
  const bars = t.totals.map((x,i) => {
    const bx = pad + i * bw;
    const sw = bw * 0.30, gap = bw * 0.06;
    const sh = (x.spent / max) * (H - 42), bh = (x.budgeted / max) * (H - 42);
    const over = x.spent > x.budgeted && x.budgeted > 0;
    return `
      <rect x="${bx + bw/2 - sw - gap/2}" y="${H-22-bh}" width="${sw}" height="${Math.max(bh,1)}" rx="3" fill="#D8D5CF"/>
      <rect x="${bx + bw/2 + gap/2}" y="${H-22-sh}" width="${sw}" height="${Math.max(sh,1)}" rx="3"
        fill="${over ? '#B8676C':'#45688E'}"/>
      <text x="${bx + bw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="#767B82">${t.months[i].label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${bars}</svg>
    <div style="display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px;justify-content:center">
      <span><span style="display:inline-block;width:9px;height:9px;background:#D8D5CF;border-radius:2px;margin-right:5px"></span>Budgeted</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:#45688E;border-radius:2px;margin-right:5px"></span>Spent</span>
    </div>`;
}

function sparkline(data) {
  const W = 76, H = 26;
  const max = Math.max(...data.map(d => Math.max(d.spent, d.budgeted || 0)), 1);
  const bw = W / data.length;
  const bars = data.map((d,i) => {
    const h = (d.spent / max) * (H - 4);
    const over = d.budgeted && d.spent > d.budgeted;
    return `<rect x="${i*bw+1}" y="${H-h}" width="${bw-2}" height="${Math.max(h,1)}" rx="1.5"
      fill="${over ? '#B8676C':'#45688E'}" opacity="${i===data.length-1 ? 1 : .5}"/>`;
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="flex:none">${bars}</svg>`;
}

async function openTrend(category) {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelector('nav button[data-v="trends"]').classList.add('active');
  document.getElementById('view-trends').classList.add('active');
  window.scrollTo(0,0);

  const el = document.getElementById('trends-body');
  el.innerHTML = '<div class="empty">Loading</div>';
  const series = await get('getCategoryTrend', { category:category, months:6 });

  const withB = series.filter(s => s.budgeted != null && s.budgeted > 0);
  const overs = withB.filter(s => s.spent > s.budgeted).length;
  const active = series.filter(s => s.spent > 0);
  const avg = active.length ? active.reduce((s,x) => s + x.spent, 0) / active.length : 0;
  const curB = withB.length ? withB[withB.length-1].budgeted : 0;

  let advice = '';
  if (withB.length >= 3 && overs >= Math.ceil(withB.length * 0.6)) {
    advice = `<div class="note flag">Over budget in ${overs} of the last ${withB.length} months.
      Average is ${money(avg)} against a ${money(curB)} budget. Raising it to about ${money(Math.ceil(avg/25)*25)} would match reality.</div>`;
  } else if (active.length >= 3 && curB > 0 && avg < curB * 0.6) {
    advice = `<div class="note">Consistently under. Average is ${money(avg)} against ${money(curB)},
      so roughly ${money(curB - avg)} a month could move elsewhere.</div>`;
  }

  el.innerHTML = `
    <span class="back" id="back">← All categories</span>
    <div class="card">
      <div style="font-size:16px;font-weight:600;margin-bottom:2px">${esc(category)}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Last 6 months</div>
      ${bars(series)}
    </div>
    ${advice}
    <div class="card tight">${series.map(s => `
      <div class="lrow"><div class="nm">${s.label}</div>
        <div class="vl" style="color:${s.budgeted && s.spent > s.budgeted ? 'var(--over)':'var(--text)'}">
          ${money(s.spent)}${s.budgeted ? ' <span style="color:var(--faint);font-weight:400">/ ' + money(s.budgeted) + '</span>':''}
        </div></div>`).join('')}</div>`;
  document.getElementById('back').onclick = loadCompare;
}

function bars(series) {
  const W = 300, H = 130, pad = 22;
  const max = Math.max(...series.map(s => Math.max(s.spent, s.budgeted || 0)), 1);
  const bw = (W - pad*2) / series.length;
  const b = series.map((s,i) => {
    const x = pad + i*bw + bw*0.18, w = bw*0.64;
    const h = (s.spent/max)*(H-40), y = H-20-h;
    const over = s.budgeted && s.spent > s.budgeted;
    return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="3"
      fill="${over ? '#B8676C':'#45688E'}" opacity="${i===series.length-1 ? 1 : .72}"/>
      <text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="#767B82">${s.label}</text>`;
  }).join('');
  const bd = [...series].reverse().find(s => s.budgeted != null && s.budgeted > 0);
  let line = '';
  if (bd) {
    const y = H-20-(bd.budgeted/max)*(H-40);
    line = `<line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" stroke="#767B82" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
      <text x="${W-pad}" y="${y-4}" text-anchor="end" font-size="9.5" fill="#767B82">budget ${money(bd.budgeted)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${line}${b}</svg>`;
}

// ============ ACCOUNTS ============
async function loadAccounts() {
  const el = document.getElementById('accounts-body');
  el.innerHTML = '<div class="empty">Loading</div>';
  const accounts = await get('getAccounts');
  const rules = await get('getRules');

  const list = (accounts && accounts.length)
    ? accounts.map(a => `<div class="lrow"><div><div class="nm">${esc(a.institution)}</div>
        <div class="sb">${a.cards.map(esc).join(' · ')}</div></div></div>`).join('')
    : '<div class="empty" style="padding:22px">No accounts connected yet.</div>';

  const ruleList = (rules && rules.length)
    ? rules.map(r => `<div class="lrow">
        <div style="min-width:0;flex:1"><div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.example)}</div>
        <div class="sb">${r.auto
          ? 'files automatically · ' + r.agreed + ' of ' + r.total
          : 'suggests only · needs ' + Math.max(0, 2 - r.total) + ' more'}</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="rule-cat" style="${r.auto ? '' : 'opacity:.6'}">${esc(r.category)}</span>
          <span class="rm" data-m="${esc(r.match)}" style="color:var(--faint);cursor:pointer;font-size:17px">×</span>
        </div></div>`).join('')
    : '<div class="empty" style="padding:22px">No rules yet. Categorize a few transactions and they build themselves.</div>';

  el.innerHTML = `
    <div class="note">One login can cover several accounts. Both Chase cards under one Chase login count as a single connection against the 10 you have.</div>
    <div class="section-label">Connected</div>
    <div class="card tight">${list}</div>
    <div class="card"><button class="btn" id="connect">Connect an account</button></div>

    <div class="section-label">Merchant memory<span id="apply-rules">apply to queue</span></div>
    <div class="note">Tag a payee once and it only suggests, shown as a dashed chip you still have to save. Tag it the same way twice and it starts filing itself on sync. Change your mind and the streak resets.</div>
    <div class="card tight">${ruleList}</div>`;

  document.getElementById('connect').onclick = connectAccount;
  document.getElementById('apply-rules').onclick = async () => {
    const r = await post({ action:'applyRules' });
    alert(r.applied ? r.applied + ' transactions categorized from memory.' : 'Nothing in the queue matched a known payee.');
    trendCache = null; loadAccounts();
  };
  el.querySelectorAll('.rm').forEach(x => x.onclick = async () => {
    if (!confirm('Forget this merchant rule?')) return;
    await post({ action:'deleteRule', payee:x.dataset.m });
    loadAccounts();
  });
}

async function connectAccount() {
  const r = await post({ action:'createLinkToken' });
  if (!r.link_token) { alert(r.error_message || r.error || 'Could not start Plaid.'); return; }
  Plaid.create({ token:r.link_token, onSuccess: async (pt) => {
    const name = prompt('Name this institution (e.g. Chase, SoFi):');
    if (!name) return;
    const res = await post({ action:'connectAccount', publicToken:pt, accountName:name });
    if (res.error) { alert(res.error); return; }
    await post({ action:'forceSync' });
    trendCache = null; loadAccounts();
  }}).open();
}

function fmtDate(d) {
  return new Date(String(d).slice(0,10) + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

loadCategorize();
